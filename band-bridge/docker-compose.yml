services:
  bridge:
    build:
      context: ..
      dockerfile: band-bridge/Dockerfile
    env_file: .env
    # The default entrypoint reads BAND_BRIDGE_AGENTS from the env file.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped
