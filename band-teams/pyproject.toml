[project]
name = "band-teams-spike"
version = "0.1.0"
description = "Controlled Teams and hosted Band qualification harness"
requires-python = ">=3.12"
dependencies = [
  "microsoft-teams-apps==2.1.1",
  "band-client-rest==0.0.50",
  "phoenix-channels-python-client==0.4.4",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
band-teams = "bandteams.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bandteams"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pyrefly>=0.18", "ruff>=0.14", "hypothesis>=6", "looptime>=0.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = ["looptime: controlled event-loop clock"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
search-path = ["src"]
