# Copilot and Band tools as two independent services (the cloud-style topology).
#
#   host: client.py (Band SDK)  --stdio-->  docker compose exec -T copilot copilot --acp
#                                           (one process per Band room)
#   copilot (in container)      --SSE---->  band-mcp:3000 (compose DNS)
#
# Nothing is published to the host: the SDK reaches Copilot through `docker
# compose exec`, and only Copilot dials band-mcp, inside the compose network.

services:
  band-mcp:
    build:
      context: .
      dockerfile: Dockerfile.band-mcp
    environment:
      # band-mcp acts as ONE Band identity (an agent key: band_a_…).
      # The MCP client (Copilot) sends no credentials, so keep this service off the
      # host network — it is a trusted sidecar reachable only within the compose net.
      BAND_AGENT_KEY: ${BAND_AGENT_KEY:?set BAND_AGENT_KEY in .env}
      # Point band-mcp at your Band platform (its own default is https://app.band.ai).
      BAND_BASE_URL: ${BAND_REST_URL:-https://app.band.ai}
      # Allow the compose-DNS host Copilot dials; without this every SSE request 421s.
      ALLOWED_HOSTS: '["band-mcp:*"]'
    expose:
      - "3000"  # internal to the compose network only; NOT published to the host

  copilot:
    build:
      context: .
      dockerfile: Dockerfile.copilot
    environment:
      # Copilot-entitled token; the Copilot CLI reads it automatically.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN (Copilot-entitled) in .env}
    volumes:
      # Same path on both sides: the SDK creates one workspace per room under it
      # on the host and hands that path to Copilot as the session cwd.
      - ${COPILOT_WORKSPACES:?set COPILOT_WORKSPACES (absolute path) in .env}:${COPILOT_WORKSPACES}
    depends_on:
      - band-mcp
