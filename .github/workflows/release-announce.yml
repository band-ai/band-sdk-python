# Called from Fern on its nightly schedule or manual dispatch. Code and tests
# stay in the public SDK; execution, private inputs and artifacts stay in Fern.
# Claude reviews with restricted file tools and no App token. A separate job
# checks its edits against the pre-review tree using trusted scripts, then
# files with the existing App; GITHUB_TOKEN reads CI checks.
# Live collect writes a marker before any posts; recovery is Re-run failed jobs.
# Download the private bundle from the Fern run for local --bundle recovery.

name: release-announce
'on':
  workflow_call:
    inputs:
      tag:
        description: Release tag; empty scans recent releases
        type: string
        default: ''
      mode:
        description: live, test, or dry-run
        type: string
        default: live
      model:
        description: Claude model override
        type: string
        default: ''
      app_client_id:
        description: Fern filing App client ID
        type: string
        required: true
    secrets:
      anthropic_api_key:
        required: true
      slack_webhook_url:
        required: true
      discord_webhook_url:
        required: true
      app_private_key:
        required: true
permissions:
  contents: read
env:
  MODE: ${{ inputs.mode }}
  SKILL: .claude/skills/band-release-docs
  ANTHROPIC_MODEL: ${{ inputs.model || vars.ANTHROPIC_MODEL || 'sonnet' }}
jobs:

  scan:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.scan.outputs.tag }}
    steps:
      - name: Checkout the workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Find the oldest unannounced release
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_REPO: ${{ job.workflow_repository }}
        run: uv run --script "$SKILL/scripts/scanreleases.py" --sdk "$SDK_REPO" --caller "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --outputs "$GITHUB_OUTPUT"

  collect:
    if: "!cancelled() && (inputs.tag != '' || needs.scan.outputs.tag != '')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.collect.outputs.proceed }}
      has_changes: ${{ steps.collect.outputs.has_changes }}
    steps:
      - name: Validate the tag
        run: |
          case "$MODE" in live|test|dry-run) ;; *) echo "::error::Invalid release mode"; exit 1 ;; esac
          if [[ ! "$TAG" =~ ^band-sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a band-sdk-vX.Y.Z tag"
            exit 1
          fi
      - name: Checkout the workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Load release configuration
        run: uv run --script "$SKILL/scripts/releaseconfig.py" "$GITHUB_ENV"
      - name: Checkout the released SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ env.TAG }}
          path: sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the release's PRs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ job.workflow_repository }}
        run: |
          args=("$TAG" --repo sdk --caller "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --outputs "$GITHUB_OUTPUT")
          if [[ "$MODE" == live ]]; then args+=(--live); fi
          uv run --script "$SKILL/scripts/collectprs.py" "${args[@]}" > release-prs.json
      - name: Record why nothing is announced
        if: steps.collect.outputs.reason != ''
        env:
          REASON: ${{ steps.collect.outputs.reason }}
        run: echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release-prs.json
        if: steps.collect.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-prs
          path: release-prs.json
          overwrite: true
      - name: Write the announcement marker
        if: steps.collect.outputs.proceed == 'true' && env.MODE == 'live'
        run: |
          mkdir -p "$RUNNER_TEMP/marker"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/marker/tag"
      - name: Mark the release announced
        if: steps.collect.outputs.proceed == 'true' && env.MODE == 'live'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ANNOUNCED_MARKER_PREFIX }}${{ env.TAG }}
          path: ${{ runner.temp }}/marker/tag
          retention-days: ${{ env.MARKER_RETENTION_DAYS }}
          overwrite: true
          if-no-files-found: error
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
    needs:
      - scan

  changelog:
    needs:
      - collect
      - scan
    if: "!cancelled() && needs.collect.outputs.proceed == 'true' && needs.collect.outputs.has_changes == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_NAME: Band Python SDK
      PRODUCT_LABEL: Python SDK
      PRODUCT_TAG: python
      CHANGELOG_MAX_TURNS: 30
      CHANGELOG_MAX_BUDGET_USD: 3
      CHANGELOG_TIMEOUT_MINUTES: 20
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
    outputs:
      has_entry: ${{ steps.build.outputs.has_entry }}
    steps:
      - name: Checkout the skill only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Download release-prs.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-prs
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Load release configuration
        run: uv run --script "$SKILL/scripts/releaseconfig.py" "$GITHUB_ENV"
      - name: Emit the report schema
        id: schema
        run: echo "schema=$(uv run --script "$SKILL/scripts/reportschema.py")" >> "$GITHUB_OUTPUT"
      - name: Drop the SDK git directory
        run: rm -rf .git
      - name: Write the changelog items
        id: claude
        timeout-minutes: ${{ fromJSON(env.CHANGELOG_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          prompt: Follow ${{ env.SKILL }}/changelog.md for release ${{ env.TAG }}. The release's PRs are in release-prs.json
            in the working directory.
          claude_args: --max-turns ${{ env.CHANGELOG_MAX_TURNS }} --max-budget-usd ${{ env.CHANGELOG_MAX_BUDGET_USD }} --tools
            Read,Glob,Grep --restricted --strict-mcp-config --json-schema '${{ steps.schema.outputs.schema }}'
          show_full_output: 'false'
          display_report: 'false'
      - name: Read the report
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: uv run --script "$SKILL/scripts/extractreport.py" "$EXECUTION_FILE" --out report.json
      - name: Trace the items to the release
        id: build
        run: |
          uv run --script "$SKILL/scripts/builditems.py" report.json release-prs.json \
            --product-name "$PRODUCT_NAME" --product-label "$PRODUCT_LABEL" \
            --product-tag "$PRODUCT_TAG" \
            --out full/release-notes.json --outputs "$GITHUB_OUTPUT"
          cp release-prs.json full/
      - name: Upload the full release notes
        if: steps.build.outputs.has_entry == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes-full
          path: full/
          overwrite: true
      - name: Summarize
        env:
          HAS_ENTRY: ${{ steps.build.outputs.has_entry }}
        run: |
          {
            echo "Model: \`$ANTHROPIC_MODEL\`"
            echo
            if [[ "$HAS_ENTRY" != true ]]; then
              echo "Claude judged no user-facing changes; nothing is attached, posted, or filed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
    permissions:
      contents: read

  holdbacks:
    needs:
      - changelog
      - scan
    if: "!cancelled() && needs.changelog.outputs.has_entry == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOLDBACKS_MAX_TURNS: 20
      HOLDBACKS_MAX_BUDGET_USD: 1
      HOLDBACKS_TIMEOUT_MINUTES: 15
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
    outputs:
      has_entry: ${{ steps.holdbacks.outputs.has_entry }}
      held: ${{ steps.holdbacks.outputs.held }}
    steps:
      - name: Checkout the skill only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Download the full release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes-full
          path: full
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Load release configuration
        run: uv run --script "$SKILL/scripts/releaseconfig.py" "$GITHUB_ENV"
      - name: Check out Fern dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.FERN_BASE }}
          path: fern
          persist-credentials: false
      - name: Limit the holdbacks inputs
        run: |
          rm -rf fern/.git
          find fern -mindepth 1 -maxdepth 1 ! -name .changelog ! -name "$DOCS_STRUCTURE" -exec rm -rf {} +
      - name: Emit the holdbacks schema
        id: holdbacks-schema
        run: echo "schema=$(uv run --script "$SKILL/scripts/reportschema.py" --kind holdbacks)" >> "$GITHUB_OUTPUT"
      - name: Drop the SDK git directory
        run: rm -rf .git
      - name: Review the holdbacks
        id: holdbacks-claude
        timeout-minutes: ${{ fromJSON(env.HOLDBACKS_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          ACTIONS_STEP_DEBUG: 'false'
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          show_full_output: 'false'
          display_report: 'false'
          prompt: Follow ${{ env.SKILL }}/holdbacks.md for release ${{ env.TAG }}. The items are in full/release-notes.json;
            the ledger and the docs summary are under fern/.
          claude_args: --max-turns ${{ env.HOLDBACKS_MAX_TURNS }} --max-budget-usd ${{ env.HOLDBACKS_MAX_BUDGET_USD }} --tools
            Read,Glob,Grep --restricted --strict-mcp-config --json-schema '${{ steps.holdbacks-schema.outputs.schema }}'
      - name: Read the holdbacks report
        env:
          EXECUTION_FILE: ${{ steps.holdbacks-claude.outputs.execution_file }}
        run: |
          uv run --script "$SKILL/scripts/extractreport.py" "$EXECUTION_FILE" \
            --kind holdbacks --out "$RUNNER_TEMP/holdbacks-report.json"
      - name: Hold back the held items
        id: holdbacks
        run: |
          uv run --script "$SKILL/scripts/holdbacks.py" full/release-notes.json full/release-prs.json \
            --ledger "fern/$HELD_ITEMS" --report "$RUNNER_TEMP/holdbacks-report.json" \
            --out bundle/ --outputs "$GITHUB_OUTPUT"
      - name: Render and validate the Fern entry
        if: steps.holdbacks.outputs.has_entry == 'true'
        env:
          HELD: ${{ steps.holdbacks.outputs.held }}
        run: |
          read -ra held <<< "$HELD"
          uv run --script "$SKILL/scripts/renderentry.py" full/release-notes.json --out bundle/ --drop "${held[@]}"
          cp full/release-prs.json bundle/
      - name: Upload the bundle
        if: steps.holdbacks.outputs.has_entry == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle
          path: bundle/
          overwrite: true
      - name: Summarize
        env:
          HAS_ENTRY: ${{ steps.holdbacks.outputs.has_entry }}
          HELD: ${{ steps.holdbacks.outputs.held }}
        run: |
          read -ra held <<< "$HELD"
          {
            echo "Held back: ${#held[@]} item(s)."
            echo
            if [[ "$HAS_ENTRY" == true ]]; then
              echo '```md'
              cat bundle/*.md
              echo '```'
            else
              echo "Every item is held back; nothing is attached, posted, or filed as a changelog."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
    permissions:
      contents: read

  slack:
    needs:
      - scan
      - changelog
      - holdbacks
    if: "!cancelled() && needs.holdbacks.outputs.has_entry == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the skill only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundle
          path: bundle
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Format the Slack post
        run: |
          args=(--notes bundle/release-notes.json --target slack-webhook)
          if [[ "$MODE" == test ]]; then args+=(--test); fi
          uv run --script "$SKILL/scripts/announcement.py" "${args[@]}" > message.txt
          { echo '```'; cat message.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post to Slack
        if: env.MODE != 'dry-run'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
        run: uv run --script "$SKILL/scripts/postslack.py" --message-file message.txt
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}

  discord:
    needs:
      - scan
      - changelog
      - holdbacks
    if: "!cancelled() && needs.holdbacks.outputs.has_entry == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the skill only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundle
          path: bundle
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Format the Discord post
        run: |
          args=(--notes bundle/release-notes.json --target discord)
          if [[ "$MODE" == test ]]; then args+=(--test); fi
          uv run --script "$SKILL/scripts/announcement.py" "${args[@]}" > message.txt
          { echo '```'; cat message.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post to Discord
        id: post
        if: env.MODE != 'dry-run'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
        run: |
          args=(--message-file message.txt)
          if [[ "$MODE" == test ]]; then args+=(--no-mentions); fi
          message_id=$(uv run --script "$SKILL/scripts/postdiscord.py" "${args[@]}")
          echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          echo "Discord message id: \`$message_id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the test post
        if: env.MODE == 'test'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
          MESSAGE_ID: ${{ steps.post.outputs.message_id }}
        run: uv run --script "$SKILL/scripts/postdiscord.py" --delete "$MESSAGE_ID"
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}

  docs:
    needs:
      - scan
      - changelog
      - holdbacks
    if: "!cancelled() && needs.holdbacks.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_ENTRY: ${{ needs.holdbacks.outputs.has_entry }}
      HELD: ${{ needs.holdbacks.outputs.held }}
      DOCS_MAX_TURNS: 60
      DOCS_MAX_BUDGET_USD: 5
      DOCS_TIMEOUT_MINUTES: 30
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
    outputs:
      docs: ${{ steps.state.outputs.docs }}
      review: ${{ steps.docs-report.outcome }}
    steps:
      - name: Prepare trusted SDK inputs
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          git clone --quiet "https://github.com/$WORKFLOW_REPOSITORY.git" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" checkout --quiet "$WORKFLOW_SHA"
          {
            echo "SRC=$RUNNER_TEMP/source"
            echo "SCRIPTS=$RUNNER_TEMP/source/$SKILL/scripts"
          } >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Load release configuration
        run: uv run --script "$RUNNER_TEMP/source/$SKILL/scripts/releaseconfig.py" "$GITHUB_ENV"
      - name: Download the full release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes-full
          path: ${{ runner.temp }}/full
      - name: Check out Fern dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.FERN_BASE }}
          path: fern
          persist-credentials: false
      - name: Pick the Fern state arguments
        run: |
          {
            if [[ "$HAS_ENTRY" == true ]]; then
              printf -- '--date\n%s\n' "$(jq -r .release_date "$RUNNER_TEMP/full/release-notes.json")"
            fi
            if [[ "$MODE" == test ]]; then echo --rehearsal; fi
          } > "$RUNNER_TEMP/state-args"
      - name: Read the Fern state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t args < "$RUNNER_TEMP/state-args"
          uv run --script "$SCRIPTS/fernstate.py" "$TAG" --out "$RUNNER_TEMP/state" \
            --outputs "$GITHUB_OUTPUT" "${args[@]}"
      - name: Pick the docs range
        id: docs-range
        if: steps.state.outputs.docs != 'skip'
        continue-on-error: true
        run: |
          uv run --script "$SCRIPTS/docsrange.py" "$TAG" "$RUNNER_TEMP/state" \
            --repo "$SRC" > "$RUNNER_TEMP/range.json"
      - name: Collect the review's PRs
        id: review-all
        if: steps.docs-range.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ job.workflow_repository }}
        run: |
          baseline=$(jq -r .baseline "$RUNNER_TEMP/range.json")
          uv run --script "$SCRIPTS/collectprs.py" "$TAG" --since "$baseline" --repo "$SRC" > "$RUNNER_TEMP/review-all.json"
      - name: Withhold held PRs from the review
        id: review-input
        if: steps.review-all.outcome == 'success'
        continue-on-error: true
        run: |
          read -ra held <<< "$HELD"
          uv run --script "$SCRIPTS/withhold.py" "$RUNNER_TEMP/review-all.json" \
            "$RUNNER_TEMP/full/release-notes.json" --ledger "fern/$HELD_ITEMS" \
            --held "${held[@]}" > review-prs.json
      - name: Prepare the review workspace
        if: steps.review-input.outcome == 'success'
        continue-on-error: true
        run: |
          cp -a fern "$RUNNER_TEMP/pristine"
          rm -rf "$RUNNER_TEMP/pristine/.git" fern/.git
          mkdir sdk
          git -C "$SRC" archive "$TAG" | tar -x -C sdk
          cp "$SRC/$SKILL/docs.md" docs.md
        id: review-workspace
      - name: Emit the docs schema
        id: docs-schema
        if: steps.review-workspace.outcome == 'success'
        run: echo "schema=$(uv run --script "$SCRIPTS/reportschema.py" --kind docs)" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Review the docs
        id: docs-claude
        if: steps.docs-schema.outcome == 'success'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.DOCS_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          ACTIONS_STEP_DEBUG: 'false'
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          show_full_output: 'false'
          display_report: 'false'
          prompt: Follow docs.md in the working directory for release ${{ env.TAG }}. The Fern checkout is fern/, the released
            source is sdk/, and the review input is review-prs.json.
          claude_args: --max-turns ${{ env.DOCS_MAX_TURNS }} --max-budget-usd ${{ env.DOCS_MAX_BUDGET_USD }} --tools Read,Glob,Grep,Edit,Write
            --restricted --strict-mcp-config --permission-mode acceptEdits --permission-prompts none --json-schema '${{ steps.docs-schema.outputs.schema
            }}'
      - name: Read the docs report
        id: docs-report
        if: steps.state.outputs.docs != 'skip' && steps.docs-claude.outcome == 'success'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.docs-claude.outputs.execution_file }}
        run: |
          uv run --script "$SCRIPTS/extractreport.py" "$EXECUTION_FILE" \
            --kind docs --out "$RUNNER_TEMP/docs-report.json"
      - name: Package the reviewed trees
        if: always() && steps.state.outputs.docs != 'skip'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/docs-review"
          if [[ -d "$RUNNER_TEMP/pristine" ]]; then cp -a "$RUNNER_TEMP/pristine" "$RUNNER_TEMP/docs-review/pristine"; fi
          if [[ -d fern ]]; then cp -a fern "$RUNNER_TEMP/docs-review/edited"; fi
          if [[ -f "$RUNNER_TEMP/docs-report.json" ]]; then cp "$RUNNER_TEMP/docs-report.json" "$RUNNER_TEMP/docs-review/docs-report.json"; fi
          rm -rf "$RUNNER_TEMP/docs-review/edited/.git"
      - name: Upload the docs review
        if: always() && steps.state.outputs.docs != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-review
          path: ${{ runner.temp }}/docs-review/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

  file:
    needs:
      - scan
      - changelog
      - holdbacks
      - docs
    if: "!cancelled() && needs.holdbacks.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      checks: read
    concurrency:
      group: release-docs-filing-${{ inputs.mode == 'dry-run' && github.run_id || inputs.mode || 'live' }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
      HAS_ENTRY: ${{ needs.holdbacks.outputs.has_entry }}
      HELD: ${{ needs.holdbacks.outputs.held }}
    outputs:
      changelog_pr: ${{ steps.file.outputs.changelog_pr }}
      docs_pr: ${{ steps.file.outputs.docs_pr }}
    steps:
      - name: Checkout the workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Locate the trusted scripts
        run: |
          {
           echo "SRC=$GITHUB_WORKSPACE/source"
           echo "SCRIPTS=$GITHUB_WORKSPACE/source/$SKILL/scripts"
          } >> "$GITHUB_ENV"
      - name: Load release configuration
        run: uv run --script "$SCRIPTS/releaseconfig.py" "$GITHUB_ENV"
      - name: Download the full release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes-full
          path: ${{ runner.temp }}/full
      - name: Download docs-review
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-review
          path: ${{ runner.temp }}/docs-review
        id: review-download
        continue-on-error: true
        if: needs.docs.outputs.docs != 'skip'
      - name: Install the MDX reader
        id: mdx-reader
        if: steps.review-download.outcome == 'success' && needs.docs.outputs.review == 'success'
        continue-on-error: true
        run: npm ci --ignore-scripts --prefix "$SCRIPTS/mdx"
      - name: Check the docs edits
        id: patch
        if: steps.mdx-reader.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv run --script "$SCRIPTS/checkpatch.py" "$RUNNER_TEMP/docs-review/pristine" "$RUNNER_TEMP/docs-review/edited" \
            --out "$RUNNER_TEMP/patch.json" --outputs "$GITHUB_OUTPUT"
      - name: Mint a Fern write token
        id: fern-write
        if: env.MODE != 'dry-run'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ env.FERN_OWNER }}
          repositories: ${{ env.FERN_REPO_NAME }}
          permission-contents: write
          permission-pull-requests: write
      - name: Pick the Fern state arguments
        run: |
          {
            if [[ "$HAS_ENTRY" == true ]]; then
              printf -- '--date\n%s\n' "$(jq -r .release_date "$RUNNER_TEMP/full/release-notes.json")"
            fi
            if [[ "$MODE" == test ]]; then echo --rehearsal; fi
          } > "$RUNNER_TEMP/state-args"
      - name: Re-read the Fern state
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t args < "$RUNNER_TEMP/state-args"
          uv run --script "$SCRIPTS/fernstate.py" "$TAG" --out "$RUNNER_TEMP/fresh" --outputs "$GITHUB_OUTPUT" "${args[@]}"
      - name: Re-pick the docs range
        id: docs-rerange
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          uv run --script "$SCRIPTS/docsrange.py" "$TAG" "$RUNNER_TEMP/fresh" \
            --repo "$SRC" > "$RUNNER_TEMP/range.json"
      - name: Check out Fern dev for filing
        if: env.MODE != 'dry-run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.FERN_BASE }}
          path: fern-write
          token: ${{ steps.fern-write.outputs.token }}
      - name: File the Fern PRs
        id: file
        if: env.MODE != 'dry-run'
        env:
          GH_TOKEN: ${{ steps.fern-write.outputs.token }}
          PATCH: ${{ steps.patch.outcome }}
          RERANGE: ${{ steps.docs-rerange.outcome }}
          CHANGED: ${{ steps.patch.outputs.changed }}
          CHECKS_TOKEN: ${{ github.token }}
        run: |
          # Held indexes also keep the docs PR from merging when every item is held.
          read -ra held <<< "$HELD"
          args=("$TAG" --fern fern-write --state "$RUNNER_TEMP/fresh" --mode "$MODE" \
            --held "${held[@]}" --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$HAS_ENTRY" == true ]]; then
            args+=(--notes "$RUNNER_TEMP/full/release-notes.json" --release-prs "$RUNNER_TEMP/full/release-prs.json")
          fi
          if [[ "$PATCH" == success && "$RERANGE" == success && "$CHANGED" != 0 ]]; then
            args+=(--docs-check "$RUNNER_TEMP/patch.json" --docs-report "$RUNNER_TEMP/docs-review/docs-report.json" \
              --docs-range "$RUNNER_TEMP/range.json" --edited "$RUNNER_TEMP/docs-review/edited" --pristine "$RUNNER_TEMP/docs-review/pristine")
          fi
          uv run --script "$SCRIPTS/filefern.py" "${args[@]}"
      - name: Fail on a failed docs review
        if: needs.docs.outputs.docs != 'skip' && (needs.docs.result != 'success' || needs.docs.outputs.review != 'success'
          || steps.patch.outcome != 'success' || steps.docs-rerange.outcome != 'success')
        run: |
          echo "::error::The docs review or its edit check failed; no docs PR was filed."
          exit 1
      - name: Summarize
        if: always()
        env:
          CHANGELOG: ${{ steps.fresh.outputs.changelog }}
          DOCS: ${{ steps.fresh.outputs.docs }}
          CHANGED: ${{ steps.patch.outputs.changed }}
          MERGEABLE: ${{ steps.patch.outputs.mergeable }}
        run: |
          {
            echo "Fern changelog: ${CHANGELOG:-not decided}; docs: ${DOCS:-not decided}."
            if [[ -n "$CHANGED" ]]; then
              echo "Docs review: $CHANGED page(s) edited; content checks passed: $MERGEABLE."
            fi
            if [[ "$MODE" == dry-run ]]; then echo "Dry run: nothing is filed."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs:
      - scan
      - collect
      - changelog
      - holdbacks
      - slack
      - discord
      - docs
      - file
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the skill only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: /${{ env.SKILL }}/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Alert Slack
        env:
          NEEDS: ${{ toJSON(needs) }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FERN_PRS: ${{ needs.file.outputs.changelog_pr }} ${{ needs.file.outputs.docs_pr }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"] | join(", ")' <<< "$NEEDS")
          {
            printf 'release-announce failed for %s (%s): %s\n%s\n' "$TAG" "$MODE" "$failed" "$RUN_URL"
            if [[ -n "${FERN_PRS// }" ]]; then printf 'Fern PRs: %s\n' "$FERN_PRS"; fi
            printf 'Recover by hand with /band-release-docs %s.\n' "$TAG"
          } | uv run --script "$SKILL/scripts/postslack.py"
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.scan.outputs.tag }}
