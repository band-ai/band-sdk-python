# Build and publish one v3 workload to both registries from a frozen SDK ref.
# Caller concurrency serializes immutable publication and floating promotion.
name: kit-publish

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub organization name
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub organization access token
        required: true
    inputs:
      ref:
        description: Git ref to check out and build from (e.g. band-sdk-vX.Y.Z)
        required: true
        type: string
      version:
        description: Bare artifact/image tag (e.g. 1.2.0 or 1.2.0-r1)
        required: true
        type: string
      major:
        description: Major version for the floating <major> tag (e.g. 1)
        required: true
        type: string
      move-floating:
        description: Also move the `latest` and `<major>` floating tags
        required: false
        default: false
        type: boolean
      extra-build-args:
        description: |
          Newline-separated extra --build-arg entries (e.g. fresh base-image
          digests for a CVE rebuild).
        required: false
        default: ""
        type: string
      quarantine-max-age-days:
        description: |
          Minimum public age (days) required of every locked package. Lowering
          it below 7 is the documented emergency override — the value used is
          recorded in the run's inputs.
        required: false
        default: 7
        type: number
      relock:
        description: |
          Re-lock uv.lock in the build context before building. Recovery only:
          use when re-publishing a released tag whose committed lock lags its
          own band-sdk version (`uv sync --locked` would refuse it). Usually
          only that self-version changes, but `uv lock` may also refresh
          in-range transitive pins — the supply-chain quarantine gate still runs
          afterward and flags any newly too-new package.
        required: false
        default: false
        type: boolean
    outputs:
      image-digest:
        description: Digest of the pushed multi-arch image
        value: ${{ jobs.image.outputs.digest }}
env:
  KIT_NAME: ghcr.io/band-ai/band-python-kit
  HUB_KIT_NAME: docker.io/bandhq/band-python-kit

jobs:
  image:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image_digest.outputs.digest }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Freeze source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reject legacy build sources before registry writes
        run: |
          uv run --no-project --with pyyaml python - <<'PYTHON'
          import yaml
          from pathlib import Path
          spec = yaml.safe_load(Path("docker/band_python_kit/spec.yaml").read_text())
          if str(spec.get("schemaVersion")) != "3" or spec.get("kind") != "workload":
              raise SystemExit("ineligible: source must contain a v3 workload; do not rebuild legacy SDK releases")
          PYTHON

      # Recovery only (dispatch kit-publish-manual with relock=true): a released
      # tag whose committed uv.lock lags its own band-sdk version can't be
      # rebuilt (`uv sync --locked` refuses it). Re-lock the checked-out build
      # context in place before the build — usually just that self-version,
      # though `uv lock` may also refresh in-range transitive pins (the
      # quarantine gate below still vets them).
      - name: Re-lock the self-version in the build context
        if: ${{ inputs.relock }}
        run: uv lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
        with:
          version: 1.3.0

      - name: Install pinned workload TCK
        run: |
          python3 scripts/install-kit-tck.py "$HOME/.local/bin/kit-tck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # One build, tags for both registries (Docker multi-registry docs).
          images: |
            ${{ env.KIT_NAME }}
            ${{ env.HUB_KIT_NAME }}
          # The trigger is a push to main (not a tag event), so tags are
          # composed from the caller's version input, never derived from the
          # git ref.
          tags: type=raw,value=${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      # The gate runs BEFORE the build and reads only the committed lock's
      # recorded upload-times — deterministic, no resolution, no index access.
      # (An in-build `uv sync --exclude-newer` cannot work: the cutoff makes
      # uv treat the committed lock as outdated on every build; proven live,
      # see scripts/check-lock-age.py and RELEASING.md.)
      - name: Supply-chain quarantine gate
        run: python3 scripts/check-lock-age.py --lock uv.lock --max-age-days "${{ inputs.quarantine-max-age-days }}"

      # X.Y.Z / X.Y.Z-rN tags are immutable by policy; the registry does not
      # enforce that, so publish only refs that are still absent. This makes a
      # rerun after a partial multi-registry push resume at the missing ref
      # without ever overwriting a completed one.
      - name: Check immutable workload tags
        id: image_state
        run: |
          set -euo pipefail
          for name in image hub_image; do
            case "$name" in
              image) ref="${KIT_NAME}:${{ inputs.version }}" ;;
              hub_image) ref="${HUB_KIT_NAME}:${{ inputs.version }}" ;;
            esac
            state="$(python3 scripts/registry-ref-state.py "$ref")"
            echo "${name}_exists=$([ "$state" = exists ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push (multi-arch, attested)
        if: ${{ steps.image_state.outputs.image_exists == 'false' && steps.image_state.outputs.hub_image_exists == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/band_python_kit/spec.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # Extra args carry fresh base digests on a CVE rebuild; empty on a
          # plain release (the committed pins are the defaults).
          build-args: ${{ inputs.extra-build-args }}

      - name: Complete a partial image publish
        if: ${{ (steps.image_state.outputs.image_exists == 'true' && steps.image_state.outputs.hub_image_exists == 'false') || (steps.image_state.outputs.image_exists == 'false' && steps.image_state.outputs.hub_image_exists == 'true') }}
        env:
          IMAGE_REF: ${{ env.KIT_NAME }}:${{ inputs.version }}
          HUB_IMAGE_REF: ${{ env.HUB_KIT_NAME }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.image_state.outputs.image_exists }}" = true ]; then
            source_ref="$IMAGE_REF"
            target_ref="$HUB_IMAGE_REF"
          else
            source_ref="$HUB_IMAGE_REF"
            target_ref="$IMAGE_REF"
          fi
          python3 scripts/validate-workload.py "$source_ref" --version "${{ inputs.version }}" --revision "${{ steps.source.outputs.revision }}"
          digest="$(oras resolve "$source_ref")"
          source_repo="${source_ref%:*}"
          oras cp --recursive "${source_repo}@${digest}" "$target_ref"
          [ "$(oras resolve "$target_ref")" = "$digest" ]

      - name: Resolve the published image digest
        id: image_digest
        env:
          IMAGE_REF: ${{ env.KIT_NAME }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Validate both immutable workloads before attesting or promoting
        run: |
          set -euo pipefail
          for ref in "${KIT_NAME}:${{ inputs.version }}" "${HUB_KIT_NAME}:${{ inputs.version }}"; do
            kit-tck validate "$ref"
            python3 scripts/validate-workload.py "$ref" --version "${{ inputs.version }}" --revision "${{ steps.source.outputs.revision }}"
          done
          [ "$(oras resolve "${KIT_NAME}:${{ inputs.version }}")" = "$(oras resolve "${HUB_KIT_NAME}:${{ inputs.version }}")" ]

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # GitHub attestations attach to the GHCR package; Hub gets the same
          # multi-arch digest via the dual push above.
          subject-name: ${{ env.KIT_NAME }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true

      - name: Mirror separate provenance referrers
        run: |
          set -euo pipefail
          digest="${{ steps.image_digest.outputs.digest }}"
          oras cp --recursive "${KIT_NAME}@${digest}" "${HUB_KIT_NAME}@${digest}"
          [ "$(oras resolve "${HUB_KIT_NAME}:${{ inputs.version }}")" = "$digest" ]
          oras discover --format json "${KIT_NAME}@${digest}" > ghcr-referrers.json
          oras discover --format json "${HUB_KIT_NAME}@${digest}" > hub-referrers.json
          python3 - <<'PYTHON'
          import json
          def digests(path):
              data = json.load(open(path))
              def walk(node):
                  found = {node["digest"]} if "digest" in node else set()
                  for child in node.get("referrers", []):
                      found.update(walk(child))
                  return found
              return walk(data)
          if not digests("ghcr-referrers.json") <= digests("hub-referrers.json"):
              raise SystemExit("mirror is missing provenance referrers")
          PYTHON

      - name: Guard floating tags against stale moves
        id: current
        if: ${{ inputs.move-floating }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          current="$(git show FETCH_HEAD:.release-please-manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])')"
          base="${{ inputs.version }}"; base="${base%%-r*}"
          move=false
          if [ "$base" = "$current" ]; then move=true; fi
          echo "move=$move" >> "$GITHUB_OUTPUT"

      - name: Move floating tags after the complete publish
        if: ${{ steps.current.outputs.move == 'true' }}
        run: |
          set -euo pipefail
          for repo in "$KIT_NAME" "$HUB_KIT_NAME"; do
            ref="${repo}:${{ inputs.version }}"
            [ "$(python3 scripts/registry-ref-state.py "$ref")" = exists ]
            kit-tck validate "$ref"
            python3 scripts/validate-workload.py "$ref" --version "${{ inputs.version }}" --revision "${{ steps.source.outputs.revision }}"
            oras tag "$ref" "${{ inputs.major }}" latest
            for tag in "${{ inputs.major }}" latest; do
              [ "$(oras resolve "$repo:$tag")" = "$(oras resolve "$ref")" ]
              kit-tck validate "$repo:$tag"
            done
          done
