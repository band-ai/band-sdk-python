# Reusable pipeline that builds, attests, and publishes both band-python-kit
# artifacts to GHCR and Docker Hub: the multi-arch sandbox image and the OCI
# kit artifact whose spec pins that image by digest. Shared (workflow_call) by
# release.yml (on a band-sdk release) and kit-image-rebuild.yml (weekly CVE
# rebuild) so the two never drift into separate copies.
#
# Hub refs are flat (Hub has no nested package path like GHCR's `/image`):
#   image → docker.io/bandhq/band-python-kit-image
#   kit   → docker.io/bandhq/band-python-kit
# Auth: repository secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN, explicitly
# forwarded by each caller. The jobs still use the release environment as the
# deployment gate, but the credentials live at repository scope because GitHub
# does not reliably expose environment secrets through this reusable workflow.
# (login-action@v4 / build-push-action@v7 multi-registry pattern — see
# https://docs.docker.com/build/ci/github-actions/push-multi-registries/).
#
# The kit targets sbx v0.35.0 (kit-spec v2 credential injection); `sbx kit
# validate` passes under it. The ORAS-assembled OCI v2 shape and the GHCR
# pull -> `sbx create --kit` roundtrip still need re-validating under 0.35.0
# (last run under v0.34.0) — see RELEASING.md. Revalidate on every sbx upgrade;
# the kit surface is experimental.
#
# NOTE (action pinning): every action in the kit publish/rebuild workflows is
# pinned to a full commit SHA per GitHub's hardening guidance for
# packages-publishing workflows (tags are movable refs; a SHA is immutable),
# with the human-readable version in a trailing comment that Dependabot/
# Renovate understand when PRing bumps.

name: kit-publish

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub organization name
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub organization access token
        required: true
    inputs:
      ref:
        description: Git ref to check out and build from (e.g. band-sdk-vX.Y.Z)
        required: true
        type: string
      version:
        description: Bare artifact/image tag (e.g. 1.2.0 or 1.2.0-r1)
        required: true
        type: string
      major:
        description: Major version for the floating <major> tag (e.g. 1)
        required: true
        type: string
      move-floating:
        description: Also move the `latest` and `<major>` floating tags
        required: false
        default: true
        type: boolean
      extra-build-args:
        description: |
          Newline-separated extra --build-arg entries (e.g. fresh base-image
          digests for a CVE rebuild).
        required: false
        default: ""
        type: string
      quarantine-max-age-days:
        description: |
          Minimum public age (days) required of every locked package. Lowering
          it below 7 is the documented emergency override — the value used is
          recorded in the run's inputs.
        required: false
        default: 7
        type: number
      relock:
        description: |
          Re-lock uv.lock in the build context before building. Recovery only:
          use when re-publishing a released tag whose committed lock lags its
          own band-sdk version (`uv sync --locked` would refuse it). Usually
          only that self-version changes, but `uv lock` may also refresh
          in-range transitive pins — the supply-chain quarantine gate still runs
          afterward and flags any newly too-new package.
        required: false
        default: false
        type: boolean
    outputs:
      image-digest:
        description: Digest of the pushed multi-arch image
        value: ${{ jobs.image.outputs.digest }}
env:
  IMAGE_NAME: ghcr.io/band-ai/band-python-kit/image
  KIT_NAME: ghcr.io/band-ai/band-python-kit
  HUB_IMAGE_NAME: docker.io/bandhq/band-python-kit-image
  HUB_KIT_NAME: docker.io/bandhq/band-python-kit

jobs:
  image:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image_digest.outputs.digest }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      # Recovery only (dispatch kit-publish-manual with relock=true): a released
      # tag whose committed uv.lock lags its own band-sdk version can't be
      # rebuilt (`uv sync --locked` refuses it). Re-lock the checked-out build
      # context in place before the build — usually just that self-version,
      # though `uv lock` may also refresh in-range transitive pins (the
      # quarantine gate below still vets them).
      - name: Install uv (relock)
        if: ${{ inputs.relock }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Re-lock the self-version in the build context
        if: ${{ inputs.relock }}
        run: uv lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # One build, tags for both registries (Docker multi-registry docs).
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.HUB_IMAGE_NAME }}
          # The trigger is a push to main (not a tag event), so tags are
          # composed from the caller's version input, never derived from the
          # git ref.
          tags: type=raw,value=${{ inputs.version }}

      # The gate runs BEFORE the build and reads only the committed lock's
      # recorded upload-times — deterministic, no resolution, no index access.
      # (An in-build `uv sync --exclude-newer` cannot work: the cutoff makes
      # uv treat the committed lock as outdated on every build; proven live,
      # see scripts/check-lock-age.py and RELEASING.md.)
      - name: Supply-chain quarantine gate
        run: python3 scripts/check-lock-age.py --lock uv.lock --max-age-days "${{ inputs.quarantine-max-age-days }}"

      # X.Y.Z / X.Y.Z-rN tags are immutable by policy; the registry does not
      # enforce that, so publish only refs that are still absent. This makes a
      # rerun after a partial multi-registry push resume at the missing ref
      # without ever overwriting a completed one.
      - name: Check immutable image tags
        id: image_state
        run: |
          set -euo pipefail
          for name in image hub_image; do
            case "$name" in
              image) ref="${IMAGE_NAME}:${{ inputs.version }}" ;;
              hub_image) ref="${HUB_IMAGE_NAME}:${{ inputs.version }}" ;;
            esac
            state="$(python3 scripts/registry-ref-state.py "$ref")"
            echo "${name}_exists=$([ "$state" = exists ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push (multi-arch, attested)
        if: ${{ steps.image_state.outputs.image_exists == 'false' && steps.image_state.outputs.hub_image_exists == 'false' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/band_python_kit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # Extra args carry fresh base digests on a CVE rebuild; empty on a
          # plain release (the committed pins are the defaults).
          build-args: ${{ inputs.extra-build-args }}

      - name: Complete a partial image publish
        if: ${{ (steps.image_state.outputs.image_exists == 'true' && steps.image_state.outputs.hub_image_exists == 'false') || (steps.image_state.outputs.image_exists == 'false' && steps.image_state.outputs.hub_image_exists == 'true') }}
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ inputs.version }}
          HUB_IMAGE_REF: ${{ env.HUB_IMAGE_NAME }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.image_state.outputs.image_exists }}" = true ]; then
            source_ref="$IMAGE_REF"
            target_ref="$HUB_IMAGE_REF"
          else
            source_ref="$HUB_IMAGE_REF"
            target_ref="$IMAGE_REF"
          fi
          docker buildx imagetools create --tag "$target_ref" "$source_ref"

      - name: Resolve the published image digest
        id: image_digest
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # GitHub attestations attach to the GHCR package; Hub gets the same
          # multi-arch digest via the dual push above.
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true

  kit:
    needs: [image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp distribution specs (GHCR + Hub image digests)
        run: |
          mkdir -p staging/ghcr staging/hub
          # --no-project: the helper needs only pyyaml, not the SDK's whole
          # locked environment. Each kit pins its own registry's image by
          # digest so a Hub consumer never needs a GHCR pull.
          digest="${{ needs.image.outputs.digest }}"
          uv run --no-project --with pyyaml scripts/stamp-kit-spec.py \
            --spec docker/band_python_kit/spec.yaml \
            --image-ref "${IMAGE_NAME}:${{ inputs.version }}" \
            --digest "$digest" \
            --output staging/ghcr/spec.yaml
          uv run --no-project --with pyyaml scripts/stamp-kit-spec.py \
            --spec docker/band_python_kit/spec.yaml \
            --image-ref "${HUB_IMAGE_NAME}:${{ inputs.version }}" \
            --digest "$digest" \
            --output staging/hub/spec.yaml
          echo "── GHCR stamped sandbox.image ──"
          grep 'image:' staging/ghcr/spec.yaml
          echo "── Hub stamped sandbox.image ──"
          grep 'image:' staging/hub/spec.yaml
          grep -qF "${IMAGE_NAME}:${{ inputs.version }}@${digest}" staging/ghcr/spec.yaml
          grep -qF "${HUB_IMAGE_NAME}:${{ inputs.version }}@${digest}" staging/hub/spec.yaml

      - name: Assemble the OCI v2 kit layers
        run: |
          # Our kit ships no files/ (behavioral mixin: network + startup only),
          # but the OCI v2 manifest still requires exactly one layer — an empty
          # tar+gzip, not zero layers.
          tar -czf staging/ghcr/empty-layer.tar.gz --files-from /dev/null
          cp staging/ghcr/empty-layer.tar.gz staging/hub/empty-layer.tar.gz

      - name: Push the kit artifacts (GHCR + Hub)
        run: |
          # The source annotation is what links the kit package to this repo on
          # GHCR — the image gets linkage from its Dockerfile LABEL, but an
          # ORAS-assembled artifact carries no labels, only manifest
          # annotations. Hub accepts the same OCI artifact shape (ORAS).
          push_kit_if_missing() {
            local dir="$1" ref="$2"
            local state
            state="$(python3 scripts/registry-ref-state.py "$ref")"
            if [ "$state" = exists ]; then
              echo "Skipping existing immutable ref: $ref"
              return
            fi
            (
              cd "$dir"
              oras push "$ref" \
                --artifact-type application/vnd.docker.sandbox.kit.v2 \
                --annotation "org.opencontainers.image.source=https://github.com/band-ai/band-sdk-python" \
                --config spec.yaml:application/vnd.docker.sandbox.kit.v2.spec+yaml \
                empty-layer.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
            )
          }
          push_kit_if_missing staging/ghcr "${KIT_NAME}:${{ inputs.version }}"
          push_kit_if_missing staging/hub "${HUB_KIT_NAME}:${{ inputs.version }}"

  # Floating tags are the commit point: neither moves until both immutable
  # artifacts exist and the image's GitHub provenance attestation succeeded.
  # The caller-level concurrency lock covers this entire reusable workflow.
  floating:
    needs: [image, kit]
    if: ${{ inputs.move-floating }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A queued rebuild can acquire the publish slot after a newer release
      # already published. Re-read main at the commit point and leave floating
      # tags untouched when this immutable version is stale.
      - name: Guard floating tags against stale moves
        id: current
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          current="$(git show FETCH_HEAD:.release-please-manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])')"
          base="${{ inputs.version }}"; base="${base%%-r*}"
          move="true"
          if [ "$base" != "$current" ]; then
            echo "::notice::skipping floating tags: publishing ${base} but the current release is ${current}"
            move="false"
          fi
          echo "move=${move}" >> "$GITHUB_OUTPUT"

      - name: Move floating tags after the complete publish
        if: ${{ steps.current.outputs.move == 'true' }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${{ inputs.version }}"
          kit_ref="${KIT_NAME}:${{ inputs.version }}"
          hub_image_ref="${HUB_IMAGE_NAME}:${{ inputs.version }}"
          hub_kit_ref="${HUB_KIT_NAME}:${{ inputs.version }}"

          # Re-verify both immutable sources at the commit point. The helper
          # fails closed on auth/network errors; an unexpected absence is also
          # fatal because the producing jobs already succeeded.
          for ref in "$image_ref" "$kit_ref" "$hub_image_ref" "$hub_kit_ref"; do
            [ "$(python3 scripts/registry-ref-state.py "$ref")" = "exists" ]
          done

          # Move the kit first. If the image retag then fails, kit consumers are
          # still safe because its spec pins the already-published image digest;
          # a re-run idempotently completes the image tags.
          oras tag "$kit_ref" "${{ inputs.major }}" latest
          oras tag "$hub_kit_ref" "${{ inputs.major }}" latest
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${{ inputs.major }}" \
            --tag "${IMAGE_NAME}:latest" \
            "$image_ref"
          docker buildx imagetools create \
            --tag "${HUB_IMAGE_NAME}:${{ inputs.major }}" \
            --tag "${HUB_IMAGE_NAME}:latest" \
            "$hub_image_ref"
