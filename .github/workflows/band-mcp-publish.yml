# Publishes band-mcp to PyPI. Mirrors band-publish.yml's trusted-publishing
# layout (see that file's header for the full security-model rationale:
# separate build/publish jobs, environment `release`, tag-anchored version
# validation) with one addition: band-mcp declares a runtime floor on
# band-sdk (packages/band-mcp/pyproject.toml's `band-sdk>=X.Y.Z`) that a
# shared release PR updates together with both package versions. Publishing can lag PyPI's index by a couple minutes, so the
# build job waits for that exact version to actually resolve before
# installing the freshly-built wheel against it.
#
# The PyPI trusted publisher must reference this filename
# (band-mcp-publish.yml) with environment `release`. The release event only
# fires workflows present at the released tag, so tags predating this file
# are published via dispatch.

name: band-mcp-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. band-mcp-v1.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Guard the event path: never auto-publish a prerelease, and never run
    # (not even to fail) on a release event for another component's tag —
    # band-publish.yml owns band-sdk-v* releases. workflow_dispatch is
    # unfiltered here since its explicit `tag` input already gets the same
    # band-mcp-v* validation below.
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'band-mcp-v'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full refs/tags/ path: a branch that happens to share the name can
          # never shadow the tag.
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate the tag is a main-anchored band-mcp release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^band-mcp-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "::error::'${TAG}' is not a band-mcp-vX.Y.Z release tag"; exit 1; }
          tag_version="${BASH_REMATCH[1]}"
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::${TAG} does not point at a commit on main"; exit 1; }
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('packages/band-mcp/pyproject.toml','rb'))['project']['version'])")
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::packages/band-mcp/pyproject.toml version ${project_version} does not match ${TAG}"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build band-mcp package (no workspace sources)
        # --no-sources: the published wheel's metadata must declare its real
        # PyPI floor (band-sdk>=X.Y.Z), not resolve through this repo's
        # workspace override.
        run: uv build --package band-mcp --no-sources -o dist

      - name: Wait for the declared band-sdk floor to be indexed on PyPI
        run: |
          set -euo pipefail
          if [ -f .github/scripts/releasecheck.py ]; then
            uv run --no-project --with packaging python .github/scripts/releasecheck.py
            WHEEL=$(find dist -name '*.whl' -print -quit)
            uv run --no-project --with packaging python .github/scripts/releasecheck.py --wheel "$WHEEL" --output "${RUNNER_TEMP}/mcp-sdk-floor.txt"
          else
            FLOOR=$(python3 <<'PYEOF'
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile
          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as archive:
              name, = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              metadata = BytesParser().parsebytes(archive.read(name))
          requirement, = [r for r in metadata.get_all('Requires-Dist', []) if r.startswith('band-sdk>=')]
          version = requirement.removeprefix('band-sdk>=')
          assert len(version.split('.')) == 3 and all(p.isdigit() for p in version.split('.')), requirement
          print(version)
          PYEOF
            )
            echo "band-sdk==${FLOOR}" > "${RUNNER_TEMP}/mcp-sdk-floor.txt"
          fi
          FLOOR=$(cut -d= -f3 "${RUNNER_TEMP}/mcp-sdk-floor.txt")
          # Dry-run into a scratch venv: the runner's bare python3 is
          # Ubuntu's externally-managed interpreter, which uv refuses to
          # target, so probing it fails on every attempt regardless of
          # whether the version is indexed.
          uv venv /tmp/floor-check
          echo "Waiting for band-sdk==${FLOOR} to be indexed on PyPI..."
          for _ in $(seq 1 60); do
            if uv pip install "band-sdk==${FLOOR}" --dry-run --python /tmp/floor-check/bin/python; then
              echo "band-sdk==${FLOOR} is available."
              exit 0
            fi
            sleep 10
          done
          echo "::error::band-sdk==${FLOOR} did not become resolvable on PyPI within 10 minutes"
          exit 1

      - name: Install band-mcp with band-sdk resolved from PyPI
        # The install-check that motivates the wait above: prove the wheel
        # just built actually resolves and imports against its real,
        # PyPI-published floor — not this repo's workspace override.
        run: |
          uv venv "${RUNNER_TEMP}/band-mcp-verify"
          uv pip install dist/*.whl -r "${RUNNER_TEMP}/mcp-sdk-floor.txt" --python "${RUNNER_TEMP}/band-mcp-verify"

      - name: Verify imports and CLI entry point
        run: |
          "${RUNNER_TEMP}/band-mcp-verify/bin/python" <<'PYEOF'
          from band_mcp import __version__
          from band_mcp.server import run, standalone_spec
          from band_mcp.shared import StandaloneResolver, build_standalone_resolver
          print(f'band-mcp {__version__} imports successful')
          PYEOF
          "${RUNNER_TEMP}/band-mcp-verify/bin/band-mcp" --version

      - name: Verify exact SDK version and installed MCP behavior
        run: |
          EXPECTED_SDK=$(cut -d= -f3 "${RUNNER_TEMP}/mcp-sdk-floor.txt")
          "${RUNNER_TEMP}/band-mcp-verify/bin/python" -c "from importlib.metadata import version; assert version('band-sdk') == '$EXPECTED_SDK'"
          if [ -f .github/scripts/mcp-wheel-smoke.py ]; then
            "${RUNNER_TEMP}/band-mcp-verify/bin/python" -I .github/scripts/mcp-wheel-smoke.py
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: band-mcp-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing (OIDC) + reading this run's build artifact.
      id-token: write
      actions: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: band-mcp-dist
          path: dist/

      - name: Publish band-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # Idempotent recovery: a re-run after a partial upload must not
          # fail on the files that already made it to PyPI.
          skip-existing: true
