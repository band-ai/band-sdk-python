# One-off, manually-gated publish of the final thenvoi-sdk release (INT-1208).
#
# thenvoi-sdk is renamed to band-sdk and gets no further ordinary releases;
# release-please/auto-versioning is intentionally removed from this branch.
# This workflow only ever builds and publishes whatever is committed here -
# it never runs against main, since main no longer carries this file.
#
# Kept at the historical path/name (release.yml) and environment (release)
# so PyPI's existing trusted-publisher registration for thenvoi-sdk still
# matches; renaming the file or the environment breaks OIDC trust and the
# publish step will fail authentication.

name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH-FINAL to publish this final thenvoi-sdk release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event.inputs.confirm == 'PUBLISH-FINAL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate this is the intended final release
        run: |
          set -euo pipefail
          name_version=$(python3 -c "
          import tomllib
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          print(project['name'], project['version'])
          ")
          [[ "$name_version" == "thenvoi-sdk 0.2.12" ]] || {
            echo "::error::expected thenvoi-sdk 0.2.12, got '${name_version}'"; exit 1; }
          grep -qF 'Development Status :: 7 - Inactive' pyproject.toml || {
            echo "::error::pyproject.toml is missing the Inactive classifier"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build thenvoi-sdk package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thenvoi-sdk-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thenvoi-sdk-dist
          path: dist/

      - name: Publish thenvoi-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true
