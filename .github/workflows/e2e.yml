name: E2E (baseline)

# Live end-to-end run of the baseline toolkit suite: runs nightly, unattended, over
# the full lane x OS matrix. A green full-matrix run marks the tested commit
# baseline-green (the `mark-baseline` job below); `release-gate.yml` reads that mark
# to decide whether the standing release-please PR may merge — see
# tests/e2e/baseline/README.md's "CI gating & flake policy" for the full design.
# These tests provision real agents against a real Band platform and call real model
# providers, so they are not run on every PR (cost + external state) — only on the
# nightly schedule or on demand from the Actions tab.
#
# A `workflow_dispatch` with the default `lane: all` / `os: all` reproduces the
# nightly run exactly, including marking the commit baseline-green/red — it is not a
# lesser "manual mode". Only a *scoped* dispatch (one lane and/or one OS) skips the
# mark, since it only exercises part of the matrix.
#
# Lanes are DERIVED FROM THE REGISTRY, not hand-listed here. The `lanes` job
# imports the adapter registry and emits one CI lane per `ci_lanes()` entry; the
# `e2e` job fans out over them. A lane is a job: it installs the lane's `uv` extra
# and (for lanes with a server/CLI) stands that backend up. Adding an adapter to
# an existing lane needs no edit here.
#
# HOW TO ADD A LANE: lanes live in the registry, not this file. Add a `Lane`
# member + its `uv` extra in tests/e2e/baseline/toolkit/deps.py, point a
# `Dep` at it, and (only if the lane needs a server/CLI) add a setup step below
# gated to that lane id, plus the matching dropdown option in the `lane` input
# below (a guard test ties that option list back to the registry, so a missing or
# stale one fails the unit suite). Full checklist: tests/e2e/baseline/README.md.
#
# Lane ids are content-based and decoupled from the `uv` extra each installs.
# Lanes today:
# - core         — provider-key adapters with no special isolation, on the `dev`
#                  extra (agno, anthropic, claude_sdk, langgraph, pydantic_ai).
# - crewai       — crewai/crewai_flow (crewai conflicts with the dev venv's deps,
#                  so it gets its own `dev-crewai` extra; see pyproject [tool.uv]).
# - google       — gemini/google_adk (own lane so free-tier rate-limit flakiness is
#                  isolated from core; shares the `dev` extra).
# - backends     — the CLI/server coding agents in one job (on the `dev` extra):
#                  CodexAdapter (codex CLI) + the codex-acp e2e, OpencodeAdapter
#                  (local `opencode serve`, Zen free model), and CopilotACPAdapter
#                  (copilot CLI over ACP; Anthropic BYOK, no GitHub auth).
# - letta        — LettaAdapter against a self-hosted Letta server (docker). The
#                  adapter self-hosts its Band MCP tool server (LocalMCPServer)
#                  inside the pytest process; the container reaches it back via
#                  host.docker.internal. Own lane (shares the `dev` extra) for the
#                  server it stands up.
#
# CopilotSDKAdapter (BYOK on Anthropic) runs in `core`: the SDK self-downloads its
# CLI runtime (no setup step), so it needs no isolated lane or GitHub auth.
# CopilotACPAdapter in `backends` is BYOK on Anthropic too (the monthly
# Copilot-hosted quota exhausted mid-run and poisoned cells; a BYOK key does
# not), so no job here needs a Copilot-entitled GitHub token.
#
# An unwired backend still fails loudly (the @requires gate reports the missing
# CLI/server) until its setup block lands. `fail-fast: false`
# keeps a red lane from blocking the others.

on:
  # Nightly, full lane x OS matrix, unattended — an off-peak UTC minute (not :00) to
  # avoid GitHub's top-of-hour scheduling thundering herd. `lanes`/`e2e` resolve
  # `github.event.inputs` as empty on a schedule event, which already falls back to
  # 'all'/'all' (the full matrix) — no separate schedule-only code path needed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run (all = full matrix). Validated against the registry."
        type: choice
        default: all
        options:
          - all
          - core
          - crewai
          - google
          - backends
          - letta
          - parlant
      os:
        description: "OS to run on (all = Linux + Windows)."
        type: choice
        default: all
        options:
          - all
          - ubuntu
          - windows

# Concurrency is scoped per (lane, OS) on the e2e job below — NOT workflow-wide.
# A fresh dispatch cancels only the same lane+OS still in flight, so re-running
# one lane (e.g. to iterate on a fix) leaves the others alone. Cross-lane races
# on the shared platform are safe: each run provisions uniquely-named agents and
# the orphan sweep only reaps agents older than BAND_E2E_ORPHAN_MAX_AGE_MINUTES,
# so a concurrent run's fresh agents are never swept out from under it.

# Every job here only reads the repo; the scorecard artifacts are downloaded
# from this same run.
permissions:
  contents: read

jobs:

  lanes:
    name: resolve lanes
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.gen.outputs.lanes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up E2E environment
      uses: ./.github/actions/setup-e2e

    # The registry import is framework-free (band.adapters is lazy) and pytest-free,
    # so the default extra is enough to resolve the lane partition.
    - name: Install dependencies
      run: uv sync --extra dev

    - name: Emit lane matrix from the registry
      id: gen
      env:
        # The dispatch `lane` input; defaults to 'all' (the full matrix).
        SELECTED_LANE: ${{ github.event.inputs.lane || 'all' }}
        # The dispatch `os` input; defaults to 'all' (Linux + Windows).
        SELECTED_OS: ${{ github.event.inputs.os || 'all' }}
        # `python <file>` puts the file's own directory on sys.path, not the repo
        # root — unlike the stdin (`python -`) form this replaces, which got cwd for
        # free. PYTHONPATH makes `tests.e2e.baseline...` importable the same way.
        PYTHONPATH: .
      run: uv run python .github/scripts/emit-lane-matrix.py >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.lane }} / ${{ matrix.os }})
    needs: lanes
    runs-on: ${{ matrix.runner }}
    # Without this, GitHub's own default (360 minutes) is the only ceiling on a
    # genuinely stuck leg — observed live: three real multi-agent-collaboration
    # tests each burned their full rerun budget (attempt + 2 retries, ~6 min each)
    # before failing, ~40 minutes for just those three. This caps a leg well
    # short of the platform default while leaving headroom above that.
    timeout-minutes: 120
    # Per-(lane, OS) concurrency: a new dispatch cancels only the matching
    # lane+OS still running, never the whole matrix — so one lane can be
    # re-run in isolation. (See the note above the jobs block.)
    concurrency:
      group: e2e-baseline-${{ matrix.lane }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.lanes) }}
    # Use bash on every OS so the setup scripts and uv commands run identically
    # (Git Bash ships on the windows-latest runner).
    defaults:
      run:
        shell: bash
    env:
      E2E_TESTS_ENABLED: "true"
      # Force UTF-8 for stdout/stderr. On the windows-latest runner Python defaults
      # to the cp1252 console codec, so a framework that logs emoji (e.g. CrewAI's
      # event bus: 🤖/🔧/✅) raises UnicodeEncodeError mid-turn and fails the test.
      # No-op on Linux (already UTF-8).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # Turn budget (E2E_TIMEOUT) is not set here: it defaults to 120s in the e2e
      # settings, and slow frameworks add headroom per-test via
      # @pytest.mark.timeout(extra=...). See tests/e2e/baseline/conftest.py.
      # The registry scopes which adapters run in this lane.
      BAND_E2E_LANE: ${{ matrix.lane }}
      # The dev-crewai and dev-parlant venvs each lack the other frameworks;
      # tolerate missing framework configs there instead of failing fast (mirrors
      # ci.yml's crewai and parlant jobs).
      BAND_ALLOW_MISSING_FRAMEWORKS: ${{ (matrix.extra == 'dev-crewai' || matrix.extra == 'dev-parlant') && '1' || '0' }}
      # Secrets carry an E2E_ prefix in GitHub (so they're clearly scoped to this
      # workflow), but the code reads the unprefixed names — the mapping happens
      # here: the env var keeps its code-expected name, the secret is prefixed.
      # Band platform (the live target + the driver/observer user key).
      BAND_REST_URL: ${{ secrets.E2E_BAND_REST_URL }}
      BAND_WS_URL: ${{ secrets.E2E_BAND_WS_URL }}
      BAND_API_KEY_USER: ${{ secrets.E2E_BAND_API_KEY_USER }}
      # Optional second user key, for baseline smokes exercising two-user interaction.
      BAND_API_KEY_USER_2: ${{ secrets.E2E_BAND_API_KEY_USER_2 }}
      # Model providers (a lane simply ignores a key it has no adapter for).
      ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.E2E_GOOGLE_API_KEY }}
      # A Copilot-entitled PAT for the single Copilot-hosted (non-BYOK) auth
      # smoke — NOT the ambient secrets.GITHUB_TOKEN (a repo-scoped installation
      # token with no Copilot entitlement). One reply turn per backends run, so
      # quota use is minimal; the smoke skips when the secret is unset. Every
      # copilot_acp matrix cell runs Anthropic BYOK and ignores this.
      GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      # Per-lane scorecard: each lane writes its own adapter×test slice (pass/fail for
      # its cells, skip for out-of-lane cells, N/A + reason for exclusions). The final
      # `scorecard` job merges them. See tests/e2e/baseline/scorecard.py. Set per
      # invocation (not here) by the run step below, since a retry attempt needs its
      # own path — see that step's comment.

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up E2E environment
      uses: ./.github/actions/setup-e2e

    # --- Backend setup: each step is gated to the lane whose server/CLI it stands
    # up (the `backends` lane co-runs codex, opencode, and copilot_acp; letta is its
    # own lane). ---

    - name: Set up Node (codex, opencode)
      if: matrix.lane == 'backends'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '20'

    # Each setup script installs its backend and exports the env it discovered
    # (CODEX_CWD / OPENCODE_BASE_URL / LETTA_BASE_URL) via $GITHUB_ENV. See
    # .github/scripts/ for the inline detail.
    - name: Install + authenticate the Codex CLI (codex)
      if: matrix.lane == 'backends'
      # Invoke via `bash` explicitly: on the windows-latest runner a directly
      # executed .sh depends on the exec bit surviving checkout and Git Bash
      # resolving the shebang; `bash <script>` sidesteps both. No-op on Linux.
      run: bash .github/scripts/setup-codex.sh

    # copilot_acp drives `copilot --acp`; auth is Anthropic BYOK via the spawn env
    # (builders.py copilot_acp_env) — the job-level ANTHROPIC_API_KEY, no login.
    - name: Install the GitHub Copilot CLI (copilot_acp)
      if: matrix.lane == 'backends'
      run: bash .github/scripts/setup-copilot.sh

    - name: Install + start the OpenCode server (opencode)
      if: matrix.lane == 'backends'
      env:
        # The OpenCode Zen provider key the server reads via {env:...} substitution.
        OPENCODE_ZEN_API_KEY: ${{ secrets.E2E_OPENCODE_ZEN_API_KEY }}
      run: bash .github/scripts/setup-opencode.sh

    # The Letta server runs in docker with a host-gateway alias so it can call
    # back into the adapter's self-hosted MCP server (LocalMCPServer inside the
    # pytest process) via host.docker.internal. OPENAI_API_KEY (mapped at job
    # level) doubles as the Letta server's own LLM provider key.
    - name: Start the Letta server (letta)
      if: matrix.lane == 'letta'
      run: .github/scripts/setup-letta.sh

    # -----------------------------------------------------------------------------

    - name: Install dependencies (${{ matrix.extra }})
      run: uv sync --extra ${{ matrix.extra }}

    # Retries the lane once (`--last-failed`) on any failure before finalizing its
    # scorecard — see .github/scripts/run-baseline-e2e.sh for the full rationale,
    # including why it deliberately does not `set -e`. Invoked via `bash` explicitly:
    # this step runs on windows-latest too (only the letta lane is Linux-only), and a
    # directly executed .sh there depends on the exec bit surviving checkout and Git
    # Bash resolving the shebang (see the codex step's comment above).
    - name: Run baseline E2E (lane ${{ matrix.lane }})
      env:
        ATTEMPT1: artifacts/attempts/scorecard-${{ matrix.lane }}-${{ matrix.os }}-1.json
        ATTEMPT2: artifacts/attempts/scorecard-${{ matrix.lane }}-${{ matrix.os }}-2.json
        FINAL: artifacts/scorecard-${{ matrix.lane }}-${{ matrix.os }}.json
      run: bash .github/scripts/run-baseline-e2e.sh

    # The backends lane also exercises the editor-facing ACP path (codex-acp).
    # It uses the same ~/.codex login and a local MCP server — no Band platform.
    - name: Run codex-acp e2e (codex)
      if: matrix.lane == 'backends'
      run: uv run pytest tests/integrations/acp/test_e2e_codex_acp.py -v --no-cov

    # Environment metadata for the scorecard evidence: the validated Copilot CLI
    # version, OS, and the BYOK model (read from the same settings the builder
    # uses, so the record can't drift from the run).
    - name: Record backends environment metadata
      if: always() && matrix.lane == 'backends'
      run: |
        uv run python - <<'PY'
        import json, pathlib, platform, shutil, subprocess
        from tests.e2e.baseline.settings import BaselineSettings
        s = BaselineSettings()
        cli = shutil.which("copilot")  # the npm shim is copilot.cmd on windows
        # copilot.cmd is a batch shim: raw CreateProcess (no shell=True) can't
        # execute it directly on Windows -- shell=True lets cmd.exe resolve it.
        # Both argv pieces are static/trusted (a resolved local path + a literal
        # flag), so shell=True carries no injection risk here.
        meta = {
            "copilot_cli": subprocess.run(
                f'"{cli}" --version', shell=True, capture_output=True, text=True
            ).stdout.strip() if cli else "unavailable",
            "os": platform.platform(),
            "copilot_auth": {"mode": "byok", "provider": "anthropic",
                             "model": s.llm_models.anthropic_model},
        }
        # OS-qualified: the scorecard job downloads every OS's artifact for this
        # lane with merge-multiple=true into one shared directory, so a
        # same-named file across ubuntu/windows would silently overwrite.
        out = pathlib.Path(f"artifacts/environment-backends-{platform.system()}.json")
        out.parent.mkdir(exist_ok=True)
        out.write_text(json.dumps(meta, indent=2) + "\n")
        PY

    - name: Stop the Letta server (letta)
      if: always() && matrix.lane == 'letta'
      run: docker rm -f letta-server || true

    # Emitted even when tests fail (session end still runs), so a red lane still
    # contributes its pass/fail rows to the merged scorecard.
    - name: Upload lane scorecard
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scorecard-${{ matrix.lane }}-${{ matrix.os }}
        path: |
          artifacts/scorecard-*.json
          artifacts/environment-*.json
        if-no-files-found: ignore

  # Fold the per-lane scorecards into one adapter×test grid (pass / fail / skip / N-A)
  # and gate on it. `if: always()` so a failed lane still yields a scorecard and a
  # verdict — the run must go red, not silently green, when a lane failed,
  # crashed, or timed out outright.
  scorecard:
    name: scorecard (merge + gate)
    needs: [lanes, e2e]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      # Consumed by mark-baseline to decide the baseline-green commit status and the
      # nightly digest's header/warning.
      passed: ${{ steps.verdict.outputs.ok }}
      matrix_ok: ${{ needs.e2e.result == 'success' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up E2E environment
      uses: ./.github/actions/setup-e2e

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Download lane scorecards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: scorecard-*
        path: artifacts
        merge-multiple: true

    # The lane ids this invocation actually selected (every registry lane for a full
    # 'all' run, or just the dispatched one) — the gate's notion of "in scope", never
    # inferred from the merged rows themselves.
    - name: Resolve expected lanes for this run
      id: expected-lanes
      env:
        LANES_JSON: ${{ needs.lanes.outputs.lanes }}
      run: |
        lanes=$(echo "$LANES_JSON" | jq -r '[.include[].lane] | unique | join(",")')
        echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

    - name: Merge into one scorecard
      id: merge
      env:
        EXPECTED_LANES: ${{ steps.expected-lanes.outputs.lanes }}
      run: .github/scripts/merge-scorecard.sh

    # Readable on the run page without downloading the artifact.
    - name: Write step summary
      if: always()
      run: |
        if [ -f artifacts/scorecard.md ]; then
          cat artifacts/scorecard.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "no scorecard produced" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload scorecard
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scorecard
        path: |
          artifacts/scorecard.json
          artifacts/scorecard.md
          artifacts/gate-summary.md
        if-no-files-found: ignore

    # See .github/scripts/compute-gate-verdict.sh for why this combines the per-cell
    # merge gate with a whole-matrix-leg backstop instead of trusting either alone.
    - name: Compute gate verdict
      id: verdict
      if: always()
      env:
        MERGE_OK: ${{ steps.merge.outputs.passed }}
        MATRIX_OK: ${{ needs.e2e.result == 'success' }}
        E2E_RESULT: ${{ needs.e2e.result }}
      run: .github/scripts/compute-gate-verdict.sh

    - name: Fail the job on a red verdict
      if: steps.verdict.outputs.ok != 'true'
      run: exit 1

  # Marks the tested commit baseline-green/red (release-gate.yml reads this to decide
  # whether the release-please PR may merge) and posts that night's scorecard as a
  # comment on one persistent tracking issue — reopened on red, closed on green, so its
  # state also reflects "currently red/green" at a glance. Mentioning the
  # band-ai/integrations roster (.github/integrations-team.txt) on every comment rides
  # GitHub's own mention-notification delivery (each member's own account, own email)
  # instead of standing up a mailer with its own credentials. Only a full-matrix run
  # marks the commit and posts: a scoped dispatch (one lane and/or one OS) only
  # exercised part of the matrix and has nothing meaningful to say about the rest.
  mark-baseline:
    name: mark baseline-green
    needs: scorecard
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event.inputs.lane == 'all' && github.event.inputs.os == 'all'))
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      PASSED: ${{ needs.scorecard.outputs.passed }}
      MATRIX_OK: ${{ needs.scorecard.outputs.matrix_ok }}
    steps:
    # continue-on-error: the commit status below is the more important of the two
    # things this job does (it's what release-gate.yml reads) and depends only on
    # $PASSED/$MATRIX_OK (job outputs, already resolved) — never on this download
    # succeeding. A transient artifact-service hiccup here must not silently skip it;
    # the downstream steps already fall back gracefully when the scorecard files
    # never arrive (e.g. "No scorecard was produced this run").
    - name: Download the merged scorecard
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: scorecard
        path: artifacts
        if-no-files-found: warn

    - name: Mark the commit baseline-green or baseline-red
      run: .github/scripts/mark-commit-status.sh

    # .github/integrations-team.txt (one GitHub username per line) is kept as a
    # plain data file, not inline here, so updating band-ai/integrations
    # membership never means editing workflow YAML. Individual @username
    # mentions, not the @band-ai/integrations team handle — verified live that a
    # bot-authored (secrets.GITHUB_TOKEN) team mention does not reliably fan out
    # a per-member notification, even with every member's own settings correctly
    # configured.
    - name: Read integrations mentions list
      id: mentions
      run: .github/scripts/read-integrations-mentions.sh

    # One persistent issue (tracked by title, not a label — no pre-provisioned label
    # to keep in sync) is the running nightly digest: every full-matrix run comments
    # the night's scorecard on it, pass or fail, so the resolved roster gets a
    # GitHub notification (and, per each member's own settings, an email) every
    # night — not just on a red run.
    - name: Find or create the nightly results issue
      id: issue
      env:
        INTEGRATIONS_MENTIONS: ${{ steps.mentions.outputs.mentions }}
      run: .github/scripts/find-or-create-nightly-issue.sh

    - name: Post the night's scorecard and sync open/closed state
      env:
        ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        INTEGRATIONS_MENTIONS: ${{ steps.mentions.outputs.mentions }}
      run: .github/scripts/post-nightly-digest.sh
