name: Windows PowerShell component diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell-component:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      E2E_TESTS_ENABLED: 'false'
      DOCKER_TESTS_ENABLED: 'false'
    steps:
      - name: Checkout the isolated diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify immutable source provenance
        run: |
          test "$(git rev-parse HEAD^)" = 2d9217801abd3a89aa7b4070b9efe390c07e7e5c
          git diff --exit-code HEAD^ HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/scripts/windows-shell-probe.py'
          git rev-parse HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the matching locked dev environment
        run: uv sync --all-packages --locked --extra dev --python 3.13

      - name: Observe the shell boundary without SDK execution or pytest
        run: uv run --all-packages --no-sync python .github/scripts/windows-shell-probe.py

      - name: Retain process and command milestone observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-shell-component-evidence
          path: windows-shell-evidence.jsonl
          if-no-files-found: error
