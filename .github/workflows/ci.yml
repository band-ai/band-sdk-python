# Diagnostic branch only. Keep the registered path dispatchable without
# changing the default branch or any native pull request head.
name: Final-leaf Windows native ownership proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-proof:
    name: Windows final leaf ownership (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: sdk
    env:
      SDK_REF: bf3d0af87461f584e844f8bc8f9d17adddf1e4fa
      PYTHONPATH: '${{ github.workspace }}/sdk/src;${{ github.workspace }}/sdk'
      E2E_TESTS_ENABLED: 'false'
      DOCKER_TESTS_ENABLED: 'false'
    steps:
      - name: Checkout the immutable SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SDK_REF }}
          fetch-depth: 1
          path: sdk

      - name: Checkout the dispatched diagnostic only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: diagnostic

      - name: Bind provenance and install the diagnostic test overlay
        env:
          DIAGNOSTIC_REF: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SDK_REF"
          test "$(git -C ../diagnostic rev-parse HEAD)" = "$DIAGNOSTIC_REF"
          git -C ../diagnostic diff --exit-code "$SDK_REF" HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)tests/integrations/omprpc/wincustody.py' \
            ':(exclude)tests/integrations/omprpc/winseal.py' \
            ':(exclude)tests/integrations/omppeer.py'
          cp ../diagnostic/tests/integrations/omprpc/wincustody.py tests/integrations/omprpc/wincustody.py
          cp ../diagnostic/tests/integrations/omprpc/winseal.py tests/integrations/omprpc/winseal.py
          cp ../diagnostic/tests/integrations/omppeer.py tests/integrations/omppeer.py

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the locked SDK dev environment
        run: uv sync --all-packages --locked --extra dev --python 3.13

      - name: Attribute installed SDK owners and diagnostic helpers
        run: |
          git rev-parse HEAD
          uv run --all-packages --no-sync python - <<'PY'
          from __future__ import annotations

          import hashlib
          import logging
          import sys
          from pathlib import Path

          import band.integrations.codex.winspawn as spawn
          import band.integrations.omprpc.client as client
          import band.integrations.omprpc.errors as errors
          import band.integrations.omprpc.scope as scope
          import tests.integrations.omppeer as peer
          import tests.integrations.omprpc.kit as kit
          import tests.integrations.omprpc.wincustody as custody
          import tests.integrations.omprpc.winseal as seal

          sdk = Path.cwd().resolve()
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          diagnostic = sdk.parent / "diagnostic"
          logger.info("Python: %s", sys.version)
          for module, relative in (
              (client, "src/band/integrations/omprpc/client.py"),
              (errors, "src/band/integrations/omprpc/errors.py"),
              (scope, "src/band/integrations/omprpc/scope.py"),
              (spawn, "src/band/integrations/codex/winspawn.py"),
              (kit, "tests/integrations/omprpc/kit.py"),
              (peer, "tests/integrations/omppeer.py"),
              (custody, "tests/integrations/omprpc/wincustody.py"),
              (seal, "tests/integrations/omprpc/winseal.py"),
          ):
              source = Path(module.__file__).resolve()
              assert source == sdk / relative, (module.__name__, source)
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              logger.info("%s %s %s", module.__name__, source, digest)
              if module in (peer, custody, seal):
                  assert source.read_bytes() == (diagnostic / relative).read_bytes()
          assert custody.winspawn is spawn
          assert seal.winspawn is spawn
          assert custody.OmpProcessError is errors.OmpProcessError
          assert seal.CustodyProbe is custody.CustodyProbe
          assert Path(kit.OMP_PEER_SCRIPT).resolve() == Path(peer.__file__).resolve()
          PY

      - name: Exercise native RPC and Codex ownership, including both original model cells
        run: >-
          uv run --all-packages --no-sync python -m pytest
          tests/integrations/codex tests/integrations/omprpc
          tests/integrations/test_ompwire.py tests/converters/test_omp.py
          -v --no-cov --hypothesis-show-statistics

      - name: Exercise every native adapter flow and mixed-clock ownership
        run: >-
          uv run --all-packages --no-sync python -m pytest
          tests/adapters/omp tests/toolkit/test_timecontrol.py
          -v --no-cov --hypothesis-show-statistics

      - name: Observe kernel custody before process-gate teardown
        run: uv run --all-packages --no-sync python -m tests.integrations.omprpc.wincustody

      - name: Observe populated Job admission sealing on the kernel
        run: uv run --all-packages --no-sync python -m tests.integrations.omprpc.winseal

      - name: Retain exact kernel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-split-custody-evidence
          path: sdk/windows-*.jsonl
          if-no-files-found: warn
