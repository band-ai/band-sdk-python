# Temporary diagnostic branch only. Retain the registered workflow path so it
# can be dispatched without adding a workflow to the default branch.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-injected-spawn-red:
    name: Windows injected spawn regression (unfixed root, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: sdk
    env:
      PYTHONPATH: '${{ github.workspace }}/sdk/src;${{ github.workspace }}/sdk'
    steps:
      - name: Checkout diagnostic ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: probe

      - name: Checkout unfixed SDK root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 79abb7630643ee7c84be0e04274ef6ec5cb2561e
          path: sdk

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the locked SDK dev environment
        run: uv sync --all-packages --locked --extra dev

      - name: Copy the exact regression into the SDK test tree
        run: cp ../probe/tests/integrations/omprpc/test_injected_spawn.py tests/integrations/omprpc/test_injected_spawn.py

      - name: Attribute SDK sources and run the injected spawn regression
        run: |
          echo "SDK git HEAD:"
          git rev-parse HEAD
          uv run --all-packages --no-sync python -c "import band.integrations.omprpc.client as client; import tests.integrations.omprpc.kit as kit; print('SDK client:', client.__file__); print('SDK testkit:', kit.__file__)"
          uv run --all-packages --no-sync python -m pytest tests/integrations/omprpc/test_injected_spawn.py
