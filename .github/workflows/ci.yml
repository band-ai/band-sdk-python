# Diagnostic branch only. This inspects a released tool, not SDK readiness.
name: Windows access inspector probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accesschk-controls:
    name: Signed AccessChk public and private controls
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Inspect released effective-access output with dummy controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('band-accesschk-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $directory | Out-Null
          try {
            $archive = Join-Path $directory 'AccessChk.zip'
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/AccessChk.zip' -OutFile $archive -TimeoutSec 60
            $expected = '8ef5e3cf235bcf4ecdcf8b4da1c0016a75f104b8591a65cc083ae3a82d496e07'
            $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
            if ($actual -ne $expected) { throw "AccessChk archive hash mismatch: $actual" }
            Expand-Archive -Path $archive -DestinationPath $directory
            $exe = Join-Path $directory 'accesschk64.exe'
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw 'AccessChk must have a valid Microsoft signature'
            }
            Write-Host "Archive SHA256: $actual"
            Write-Host "Binary SHA256: $((Get-FileHash -Algorithm SHA256 $exe).Hash)"
            Write-Host "AccessChk version: $((Get-Item $exe).VersionInfo.FileVersion)"
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
            $owner = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $everyone = [System.Security.Principal.SecurityIdentifier]::new('S-1-1-0')
            $public = Join-Path $directory 'public-dummy.txt'
            $private = Join-Path $directory 'private-dummy.txt'
            foreach ($path in @($public, $private)) {
              Set-Content -Path $path -Value 'dummy-only-no-credentials'
              $acl = [System.Security.AccessControl.FileSecurity]::new()
              $acl.SetOwner($owner.User)
              $acl.SetAccessRuleProtection($true, $false)
              $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($owner.User, 'FullControl', 'Allow'))
              if ($path -eq $public) {
                $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($everyone, 'Read', 'Allow'))
              }
              Set-Acl -Path $path -AclObject $acl
              Write-Host "Full descriptor for $path"
              & $exe -accepteula -nobanner -l $path
              if ($LASTEXITCODE -ne 0) { throw 'AccessChk descriptor inspection failed' }
            }
            $accounts = @($owner.Name)
            foreach ($sid in @('S-1-5-19', 'S-1-5-32-545', 'S-1-5-11', 'S-1-1-0')) {
              $identity = [System.Security.Principal.SecurityIdentifier]::new($sid)
              $accounts += $identity.Translate([System.Security.Principal.NTAccount]).Value
            }
            $failedQueries = 0
            foreach ($account in $accounts) {
              foreach ($path in @($public, $private)) {
                Write-Host "Effective access: account=$account path=$path"
                & $exe -accepteula -nobanner -v $account $path
                $code = $LASTEXITCODE
                Write-Host "Query exit code: $code"
                if ($code -ne 0) { $failedQueries += 1 }
              }
            }
            if ($failedQueries -ne 0) { throw "$failedQueries effective-access queries returned nonzero; inspect the complete output" }
          } finally {
            Remove-Item -Path $directory -Recurse -Force
          }
