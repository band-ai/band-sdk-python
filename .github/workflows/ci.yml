name: CI

on:
  pull_request:
    branches: [main]
  # Run on the merge queue's temporary branch so these required checks report
  # against the queued merge result. Without this the queue would wait forever.
  merge_group:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure git to use HTTPS for GitHub
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Verify uv.lock is in sync with pyproject
      # Catches lock drift on every PR (including release-please's version-bump
      # PR), so a stale lock can never silently reach a release and break the
      # kit image build's `uv sync --locked`.
      run: uv lock --check

    - name: Verify the echo-agent starter lock is in sync with its pyproject
      # The starter ships a committed uv.lock that the kit launcher installs
      # verbatim (`uv sync --locked`), so a lock that no longer satisfies the
      # starter's constraints (e.g. a band-sdk floor bump without a relock)
      # would break every fresh kit workspace.
      run: uv lock --check --directory docker/band_python_kit/echo-agent

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Run pre-commit hooks
      run: uv run pre-commit run --all-files


  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
      fail-fast: false

    # Use bash on every OS so these steps stay identical (Git Bash ships on the
    # windows-latest runner). Keeps command substitution / quoting portable.
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure git to use HTTPS for GitHub
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Run tests
      run: uv run pytest

    - name: Run markdown doc tests
      # Linux-only: doc snippets are OS-independent, and this step relies on
      # git ls-files globbing that we don't need to re-run per platform.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      # examples/ READMEs have illustrative fragments not yet snippet-testable
      run: |
        # shellcheck disable=SC2046  # word-splitting the ls-files output is the point
        uv run pytest --markdown-docs $(git ls-files '*.md' ':!:examples/*') --no-cov


  test-crewai:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
      fail-fast: false

    # Use bash on every OS so the multiline pytest and pyrefly commands stay
    # identical across Linux and Windows.
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure git to use HTTPS for GitHub
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install crewai dependencies
      run: uv sync --locked --extra dev-crewai

    - name: Run crewai tests
      env:
        # dev-crewai venv lacks langgraph/anthropic/parlant/pydantic-ai/etc.;
        # tolerate missing framework configs instead of failing fast.
        BAND_ALLOW_MISSING_FRAMEWORKS: "1"
      # Only the tests that *need* this venv. Every other crewai test fakes the
      # package through sys.modules, so the `test` job above already runs it and
      # a second pass here would add no signal — just a path to forget.
      # tests/framework_conformance/test_crewai_job_coverage.py keeps this honest.
      run: |
        uv run pytest \
          tests/adapters/test_crewai_flow_phase3.py \
          tests/integrations/test_crewai_flow_real_sdk.py \
          tests/integrations/test_crewai_real_tools.py \
          tests/test_capability_gating_e2e.py \
          tests/framework_conformance/ -k crewai

    - name: Pyrefly check (crewai sources)
      run: |
        uv run pyrefly check \
          src/band/adapters/crewai.py \
          src/band/adapters/crewai_flow.py \
          src/band/converters/crewai.py \
          src/band/converters/crewai_flow.py \
          src/band/integrations/crewai/


  packaging:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure git to use HTTPS for GitHub
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Build wheel
      run: uv build --wheel

    - name: Install from wheel (isolated, no extras)
      run: |
        uv venv /tmp/test-install
        uv pip install dist/*.whl --python /tmp/test-install/bin/python

    - name: Verify core imports (no extras)
      run: |
        /tmp/test-install/bin/python -c "
        from band import Agent, BandLink, AgentRuntime
        from band.config import load_agent_config
        print('Core imports successful')
        "

    - name: Verify gateway extras install independently
      run: |
        uv venv /tmp/test-a2a-gateway
        WHEEL=$(ls dist/*.whl)
        uv pip install "${WHEEL}[a2a_gateway]" --python /tmp/test-a2a-gateway/bin/python
        /tmp/test-a2a-gateway/bin/python -c "
        from band.adapters.a2a_gateway import A2AGatewayAdapter
        print('Gateway extra import successful')
        "
        uv venv /tmp/test-a2a-gateway-demo
        uv pip install "${WHEEL}[a2a_gateway_demo]" --python /tmp/test-a2a-gateway-demo/bin/python
        /tmp/test-a2a-gateway-demo/bin/python -c "
        from a2a.server.routes.rest_routes import create_rest_routes
        print('Gateway demo extra route import successful')
        "

    - name: Install with all extras
      run: |
        WHEEL=$(ls dist/*.whl)
        uv pip install "${WHEEL}[dev]" --python /tmp/test-install/bin/python

    - name: Verify all imports (with extras)
      run: |
        /tmp/test-install/bin/python -c "
        from band import Agent, BandLink, AgentRuntime
        from band.adapters import LangGraphAdapter, AnthropicAdapter, PydanticAIAdapter, ClaudeSDKAdapter
        from band.converters import LangChainHistoryConverter, AnthropicHistoryConverter, PydanticAIHistoryConverter
        from band.config import load_agent_config
        print('All imports successful')
        "
