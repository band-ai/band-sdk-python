# Diagnostic branch only. Keep the registered path dispatchable without
# changing the default branch or any native pull request head.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-proof:
    name: Windows split leaf ownership (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: sdk
    env:
      PYTHONPATH: '${{ github.workspace }}/sdk/src;${{ github.workspace }}/sdk'
      E2E_TESTS_ENABLED: 'false'
      DOCKER_TESTS_ENABLED: 'false'
    steps:
      - name: Checkout the exact SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: sdk

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the locked SDK dev environment
        run: uv sync --all-packages --locked --extra dev --python 3.13

      - name: Attribute the executed sources
        run: |
          git rev-parse HEAD
          uv run --all-packages --no-sync python -c "import sys; import band.integrations.omprpc.client as client; import band.integrations.codex.winspawn as spawn; import tests.integrations.omprpc.kit as kit; print('Python:', sys.version); print('SDK client:', client.__file__); print('SDK process owner:', spawn.__file__); print('SDK testkit:', kit.__file__)"

      - name: Prove leaf product-source equivalence
        run: |
          echo "Verified SDK product source:"
          test "$(git rev-parse HEAD^)" = "db3205e2e9e660bbf5a18df028022137c7901a41"
          git diff --exit-code db3205e2e9e660bbf5a18df028022137c7901a41 HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)tests/integrations/omprpc/wincustody.py' \
            ':(exclude)tests/integrations/omprpc/winseal.py'

      - name: Exercise native RPC and Codex ownership, including both original model cells
        run: >-
          uv run --all-packages --no-sync python -m pytest
          tests/integrations/codex tests/integrations/omprpc
          tests/integrations/test_ompwire.py tests/converters/test_omp.py
          -v --no-cov --hypothesis-show-statistics

      - name: Exercise every native adapter flow and mixed-clock ownership
        run: >-
          uv run --all-packages --no-sync python -m pytest
          tests/adapters/omp tests/toolkit/test_timecontrol.py
          -v --no-cov --hypothesis-show-statistics

      - name: Observe kernel custody before process-gate teardown
        run: uv run --all-packages --no-sync python -m tests.integrations.omprpc.wincustody

      - name: Observe populated Job admission sealing on the kernel
        run: uv run --all-packages --no-sync python -m tests.integrations.omprpc.winseal

      - name: Retain exact kernel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-split-custody-evidence
          path: sdk/windows-*.jsonl
          if-no-files-found: warn
