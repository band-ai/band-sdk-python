# Standalone privacy-only diagnostic: success is NOT SDK readiness or full native-suite proof.
# The original full-root proof is separate; its suite failure is not bypassed or resolved here.
# The SDK checkout stays pinned independently of this diagnostic workflow.
name: Standalone Windows native MCP privacy-only (not SDK readiness)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-privacy-only:
    name: Privacy-only native MCP diagnostic (not SDK readiness)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk
    env:
      PYTHONPATH: '${{ github.workspace }}/sdk/src;${{ github.workspace }}/sdk'
      E2E_TESTS_ENABLED: 'false'
      DOCKER_TESTS_ENABLED: 'false'
      SDK_REF: 'c4ae7d844cc981205474ae6135ec5c5ce7505f3f'
    steps:
      - name: Check out immutable SDK root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SDK_REF }}
          path: sdk
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install locked dev environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --all-packages --locked --extra dev --python 3.13
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }

      - name: Attribute source and environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SDK_REF) { throw 'Unexpected SDK source' }
          Write-Host "Workflow commit: $env:GITHUB_SHA; SDK commit: $head"
          @'
          from __future__ import annotations

          import logging
          import sys
          from pathlib import Path

          import band.integrations.codex.winspawn as spawn
          import band.integrations.ompprocess as process
          import band.integrations.omprpc.client as client
          import band.integrations.omprpc.scope as scope
          import band.integrations.ompwire as wire
          import tests.integrations.omprpc.kit as kit

          logger = logging.getLogger(__name__)
          logging.basicConfig(level=logging.INFO)
          root = Path.cwd().resolve()
          paths = [Path(module.__file__).resolve() for module in (process, client, scope, spawn, wire)]
          kit_path = Path(kit.__file__).resolve()
          logger.info('Python=%s; executable=%s; source paths=%s; testkit=%s', sys.version, sys.executable, paths, kit_path)
          assert all(path.is_relative_to(root / 'src') for path in paths)
          assert kit_path.is_relative_to(root / 'tests')
          '@ | .venv/Scripts/python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Source attribution failed' }
          Get-FileHash -Algorithm SHA256 -Path uv.lock, src/band/integrations/ompprocess.py, src/band/integrations/omprpc/client.py, src/band/integrations/omprpc/scope.py, src/band/integrations/codex/winspawn.py, tests/integrations/omprpc/test_lifecycle_model.py

      - name: Install released OMP with the existing setup script
        shell: bash
        env:
          OMP_PACKAGE: '@oh-my-pi/pi-coding-agent@18.8.9'
        run: |
          set -euo pipefail
          export BUN_INSTALL="$RUNNER_TEMP/band-omp-runtime"
          export BUN_INSTALL_GLOBAL_DIR="$BUN_INSTALL/install/global"
          export BUN_INSTALL_BIN="$BUN_INSTALL/bin"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bash .github/scripts/setup-omp.sh
          bun_exe="$(command -v bun)"
          if [[ -f "$bun_exe.exe" ]]; then bun_exe="$bun_exe.exe"; fi
          cli="$BUN_INSTALL/install/global/node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js"
          test -f "$cli"
          printf 'OMP_PROOF_BUN=%s\n' "$(cygpath -w "$bun_exe")" >> "$GITHUB_ENV"
          printf 'OMP_PROOF_CLI=%s\n' "$(cygpath -w "$cli")" >> "$GITHUB_ENV"

      - name: Prove active native MCP receipt privacy with signed AccessChk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('band-native-proof-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $directory | Out-Null
          try {
            $archive = Join-Path $directory 'AccessChk.zip'
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/AccessChk.zip' -OutFile $archive -TimeoutSec 60
            $expected = '8ef5e3cf235bcf4ecdcf8b4da1c0016a75f104b8591a65cc083ae3a82d496e07'
            $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
            if ($actual -ne $expected) { throw "AccessChk archive hash mismatch: $actual" }
            Expand-Archive -Path $archive -DestinationPath $directory
            $exe = Join-Path $directory 'accesschk64.exe'
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw 'AccessChk must have a valid Microsoft signature'
            }
            Write-Host "AccessChk archive SHA256: $actual"
            Write-Host "AccessChk binary SHA256: $((Get-FileHash -Algorithm SHA256 $exe).Hash)"
            Write-Host "AccessChk signer: $($signature.SignerCertificate.Subject)"
            $inspect = Join-Path $directory 'inspect.ps1'
            @'
          param([string]$Exe, [string]$Manifest, [string]$Controls)
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $owner = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $sids = @('S-1-5-19', 'S-1-5-32-545', 'S-1-5-11', 'S-1-1-0')
          $accounts = foreach ($sid in $sids) {
            $identity = [System.Security.Principal.SecurityIdentifier]::new($sid)
            [pscustomobject]@{ Sid = $identity; Name = $identity.Translate([System.Security.Principal.NTAccount]).Value }
          }
          function Assert-Rights([string]$Account, [string]$Path, [string]$Expected, [bool]$Directory) {
            $flags = @('-accepteula', '-nobanner', '-v')
            if ($Directory) { $flags += '-d' }
            $lines = @(& $Exe @flags $Account $Path 2>&1)
            $code = $LASTEXITCODE
            Write-Host "Effective access: account=$Account path=$Path exit=$code"
            foreach ($line in $lines) { Write-Host ([string]$line) }
            if ($code -ne 0) { throw "AccessChk query failed: $Account $Path ($code)" }
            # Do not Trim(): no-access has THREE leading spaces; read-only has TWO after R.
            $headers = @($lines | Where-Object { [string]$_ -cmatch '^[R ][W ] \S' })
            $pattern = '^(?<rights>[R ][W ]) ' + [regex]::Escape($Path) + '$'
            if ($headers.Count -ne 1 -or [string]$headers[0] -cnotmatch $pattern) {
              throw "Expected exactly one exact-path rights header: $Account $Path"
            }
            $rights = ([string]$headers[0]).Substring(0, 2)
            if ($rights -cne $Expected) { throw "Unexpected rights '$rights', expected '$Expected': $Account $Path" }
          }
          function Show-Descriptor([string]$Path, [bool]$Directory) {
            $flags = @('-accepteula', '-nobanner', '-l')
            if ($Directory) { $flags += '-d' }
            & $Exe @flags $Path
            if ($LASTEXITCODE -ne 0) { throw "AccessChk descriptor query failed: $Path" }
          }
          # Only these two dummy controls receive ACL changes, never the real plugin or receipt.
          foreach ($isDirectory in @($false, $true)) {
            $path = Join-Path $Controls $(if ($isDirectory) { 'public-directory' } else { 'public-file.txt' })
            if ($isDirectory) {
              New-Item -ItemType Directory -Path $path | Out-Null
              $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            } else {
              Set-Content -LiteralPath $path -Value 'dummy-only-no-credentials'
              $acl = [System.Security.AccessControl.FileSecurity]::new()
            }
            $acl.SetOwner($owner.User)
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($owner.User, 'FullControl', 'Allow'))
            foreach ($account in $accounts) {
              # AuthUsers queries do not infer Everyone membership: grant EACH SID Read directly.
              $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($account.Sid, 'Read', 'Allow'))
            }
            Set-Acl -LiteralPath $path -AclObject $acl
            Show-Descriptor $path $isDirectory
            Assert-Rights $owner.Name $path 'RW' $isDirectory
            foreach ($account in $accounts) { Assert-Rights $account.Name $path 'R ' $isDirectory }
          }
          $items = @(Get-Content -LiteralPath $Manifest -Raw | ConvertFrom-Json)
          $trusted = @($owner.User.Value, 'S-1-5-18', 'S-1-5-32-544')
          foreach ($item in $items) {
            $path = [string]$item.path
            $isDirectory = [bool]$item.directory
            $acl = Get-Acl -LiteralPath $path
            $actualOwner = $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            $rules = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))
            Write-Host "Native object: $($item.kind); owner=$actualOwner; protected=$($acl.AreAccessRulesProtected)"
            Write-Host $acl.Sddl
            if ($actualOwner -notin $trusted -or $rules.Count -eq 0) { throw "Untrusted owner or missing DACL: $path" }
            foreach ($rule in $rules) {
              Write-Host "ACE sid=$($rule.IdentityReference.Value) type=$($rule.AccessControlType) rights=$($rule.FileSystemRights) inherited=$($rule.IsInherited) inheritance=$($rule.InheritanceFlags) propagation=$($rule.PropagationFlags)"
              # OWNER RIGHTS denotes the object's already-validated current owner.
              $isOwnerRights = $rule.IdentityReference.Value -eq 'S-1-3-4'
              if ($rule.AccessControlType -eq 'Allow' -and -not $isOwnerRights -and $rule.IdentityReference.Value -notin $trusted) {
                throw "Untrusted allow ACE on $path"
              }
            }
            if ($isDirectory -and -not $acl.AreAccessRulesProtected) { throw "SDK directory is not protected: $path" }
            Show-Descriptor $path $isDirectory
            Assert-Rights $owner.Name $path 'RW' $isDirectory
            foreach ($account in $accounts) { Assert-Rights $account.Name $path '  ' $isDirectory }
            # Exercise owner I/O without altering any real file or its ACL.
            if ($isDirectory) {
              $null = @(Get-ChildItem -LiteralPath $path -Force)
              $probe = Join-Path $path ('owner-control-' + [guid]::NewGuid() + '.txt')
              try { [System.IO.File]::WriteAllText($probe, 'dummy-owner-write') }
              finally { if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Force } }
            } else {
              $handle = [System.IO.File]::Open($path, 'Open', 'ReadWrite', 'ReadWrite')
              $handle.Dispose()
              $null = [System.IO.File]::ReadAllBytes($path)
            }
          }
          '@ | Set-Content -LiteralPath $inspect -Encoding utf8
            $smoke = Join-Path $directory 'native-proof.py'
            @'
          from __future__ import annotations

          import asyncio
          import json
          import logging
          import os
          import shutil
          import subprocess
          import sys
          from collections.abc import Iterable
          from pathlib import Path

          import psutil
          from mcp.server.fastmcp import FastMCP
          from pydantic import BaseModel
          from pydantic_settings import BaseSettings, SettingsConfigDict

          from band.core.defaultmodels import ANTHROPIC_SMALL_MODEL
          from band.integrations.codex.winspawn import HELPER_PATH
          from band.integrations.ompprocess import (
              OMP_MCP_RECEIPT,
              OMP_MCP_SERVERS_CONFIG,
              OMP_MCP_STARTUP_CONFIG,
              OMP_MCP_STARTUP_JS,
              OMP_MODE_FLAG,
              OMP_NATIVE_PINNED_PACKAGE,
              OMP_PLUGIN_ROOT,
              OMP_RPC_MODE,
              McpConnectionStatus,
              McpStartupReceipt,
              OmpMcpServer,
              omp_mcp_arguments,
              omp_mcp_plugin,
              omp_mcp_ready,
              omp_rpc_command_in_workspace,
          )
          from band.integrations.omprpc import OmpRpcClient
          from band.integrations.ompwire import OmpCommandName

          logger = logging.getLogger(__name__)
          DUMMY_CREDENTIAL = 'dummy-not-a-real-secret'
          MCP_SERVER_NAME = 'privacy'
          SCRIPT = Path(__file__).resolve()

          class NativeSettings(BaseSettings):
              model_config = SettingsConfigDict(extra='ignore', case_sensitive=False, env_ignore_empty=True)
              OMP_PROOF_BUN: Path
              OMP_PROOF_CLI: Path
              SystemRoot: Path
              PYTHONPATH: str

          class McpSettings(BaseSettings):
              model_config = SettingsConfigDict(extra='ignore', case_sensitive=False, env_ignore_empty=True)
              BAND_DUMMY_MCP_CREDENTIAL: str

          class NativePackage(BaseModel):
              name: str
              version: str

          class ProjectedServers(BaseModel):
              mcpServers: dict[str, OmpMcpServer]

          class NativeObject(BaseModel):
              kind: str
              path: Path
              directory: bool

          def track_processes(
              processes: Iterable[psutil.Process],
              tracked: dict[tuple[int, float], psutil.Process],
          ) -> None:
              for process in processes:
                  try:
                      created = process.create_time()
                  except psutil.NoSuchProcess:
                      logger.info('Observed descendant already retired: pid=%s', process.pid)
                  else:
                      tracked[(process.pid, created)] = process

          def capture_tree(
              helper: psutil.Process,
              tracked: dict[tuple[int, float], psutil.Process],
          ) -> list[psutil.Process]:
              track_processes([helper], tracked)
              try:
                  descendants = helper.children(recursive=True)
              except psutil.NoSuchProcess:
                  logger.info('Owned helper already retired: pid=%s', helper.pid)
                  return []
              track_processes(descendants, tracked)
              return descendants

          def assert_retired(tracked: dict[tuple[int, float], psutil.Process]) -> None:
              # psutil.Process.is_running also checks creation time, so recycled PIDs are not targets.
              survivors = [
                  process for (_, created), process in tracked.items()
                  if process.is_running() and process.create_time() == created
              ]
              if not survivors:
                  return
              for process in survivors:
                  try:
                      process.kill()
                  except psutil.NoSuchProcess:
                      logger.info('Survivor retired before fallback kill: pid=%s', process.pid)
              _, alive = psutil.wait_procs(survivors, timeout=5)
              assert not alive, 'Fallback cleanup could not reap owned processes'
              raise AssertionError('SDK close left identity-pinned helper/native/MCP processes alive')

          def local_control() -> str:
              raise AssertionError('Readiness must not invoke MCP tools')

          async def main() -> None:
              directory = Path(sys.argv[1]).resolve()
              exe, inspect = sys.argv[2:4]
              settings = NativeSettings()
              bun = settings.OMP_PROOF_BUN.resolve()
              cli = settings.OMP_PROOF_CLI.resolve()
              package = NativePackage.model_validate_json((cli.parent.parent / 'package.json').read_text(encoding='utf-8'))
              assert f'{package.name}@{package.version}' == OMP_NATIVE_PINNED_PACKAGE
              logger.info('Native package=%s; bun=%s; cli=%s', OMP_NATIVE_PINNED_PACKAGE, bun, cli)
              home = directory / 'home'
              workspace = directory / 'workspace'
              for path in (home, workspace, home / 'AppData/Roaming', home / 'AppData/Local'):
                  path.mkdir(parents=True, exist_ok=True)
              system_root = settings.SystemRoot
              pwsh = shutil.which('pwsh')
              assert pwsh is not None
              # OmpRpcClient merges parent env, so replace it before constructing the client.
              # No GitHub token, provider key, Band URL, proxy, profile or user configuration survives.
              environment = {
                  'SystemRoot': str(system_root), 'WINDIR': str(system_root),
                  'COMSPEC': str(system_root / 'System32/cmd.exe'),
                  'PATH': os.pathsep.join((str(bun.parent), str(Path(sys.executable).parent), str(system_root / 'System32'))),
                  'PATHEXT': '.COM;.EXE;.BAT;.CMD',
                  'HOME': str(home), 'USERPROFILE': str(home),
                  'APPDATA': str(home / 'AppData/Roaming'), 'LOCALAPPDATA': str(home / 'AppData/Local'),
                  'PI_CODING_AGENT_DIR': str(home / '.omp/agent'),
                  'XDG_CONFIG_HOME': str(home / '.config'), 'XDG_CACHE_HOME': str(home / '.cache'),
                  'XDG_DATA_HOME': str(home / '.local/share'),
                  'TEMP': str(directory), 'TMP': str(directory),
                  'CI': 'true', 'NO_COLOR': '1', 'TERM': 'dumb',
                  'PYTHONPATH': settings.PYTHONPATH,
              }
              os.environ.clear()
              os.environ.update(environment)
              os.chdir(workspace)
              servers = {MCP_SERVER_NAME: OmpMcpServer(
                  command=sys.executable, args=('-u', str(SCRIPT), 'mcp'),
                  env={'BAND_DUMMY_MCP_CREDENTIAL': DUMMY_CREDENTIAL},
                  headers={'Authorization': f'Bearer {DUMMY_CREDENTIAL}'},
              )}
              plugin_parent: Path | None = None
              try:
                  with omp_mcp_plugin(servers, workspace=str(workspace), system_prompt='  Local privacy smoke: do not invoke a model.  ') as plugin:
                      assert plugin is not None
                      root = Path(plugin)
                      plugin_parent = root.parent
                      receipt = root / OMP_MCP_RECEIPT
                      assert not receipt.exists(), 'Receipt must not exist before native startup'
                      config = ProjectedServers.model_validate_json((root / OMP_MCP_SERVERS_CONFIG).read_text(encoding='utf-8'))
                      projected = config.mcpServers[MCP_SERVER_NAME]
                      assert projected.env['BAND_DUMMY_MCP_CREDENTIAL'] == DUMMY_CREDENTIAL
                      assert projected.headers['Authorization'] == f'Bearer {DUMMY_CREDENTIAL}'
                      command = omp_rpc_command_in_workspace([
                          str(bun), str(cli), OMP_MODE_FLAG, OMP_RPC_MODE,
                          '--model', f'anthropic/{ANTHROPIC_SMALL_MODEL}',
                          '--no-session', '--no-extensions',
                          *omp_mcp_arguments(plugin),
                      ], str(workspace))
                      runtime = OmpRpcClient(command, env=environment)
                      helper: psutil.Process | None = None
                      tracked: dict[tuple[int, float], psutil.Process] = {}
                      try:
                          async with asyncio.timeout(60):
                              await runtime.start()
                              assert runtime._proc is not None
                              candidate = psutil.Process(runtime._proc.pid)
                              owner_process = psutil.Process()
                              owner = runtime._windows_process
                              assert owner is not None and owner.process is runtime._proc and owner.job is not None
                              assert candidate.is_running() and candidate.ppid() == owner_process.pid
                              assert Path(candidate.exe()).resolve() == Path(owner_process.exe()).resolve()
                              arguments = candidate.cmdline()
                              assert str(HELPER_PATH.resolve()) in arguments and owner.job.name in arguments
                              helper = candidate
                              descendants = capture_tree(helper, tracked)
                              candidates = [
                                  process for process in descendants
                                  if Path(process.exe()).resolve() == bun and str(cli) in process.cmdline()
                              ]
                              assert len(candidates) == 1, 'Expected one contained native Bun CLI'
                              native = candidates[0]
                              assert helper.pid != native.pid
                              assert helper.username() == native.username() == owner_process.username()
                              logger.info('Helper pid=%s created=%s; native pid=%s created=%s owner=%s', helper.pid, helper.create_time(), native.pid, native.create_time(), native.username())
                              # The SDK guard rejects agent_start, host tools or UI; only its local slash command runs.
                              await omp_mcp_ready(runtime, plugin, servers)
                              assert receipt.is_file(), 'Only real native startup may create the receipt'
                              payload = McpStartupReceipt.model_validate_json(receipt.read_text(encoding='utf-8'))
                              assert payload.systemPromptReady is True
                              assert len(payload.servers) == 1
                              assert payload.servers[0].type == McpConnectionStatus.CONNECTED
                              assert payload.servers[0].serverName == f'{OMP_PLUGIN_ROOT}:{MCP_SERVER_NAME}'
                              capture_tree(helper, tracked)
                              mcp_processes = [
                                  process for process in native.children(recursive=True)
                                  if str(SCRIPT) in process.cmdline() and 'mcp' in process.cmdline()
                              ]
                              assert mcp_processes, 'Real stdio MCP child was not active'
                              track_processes(mcp_processes, tracked)
                              for process in mcp_processes:
                                  assert process.username() == owner_process.username()
                                  logger.info('Active MCP pid=%s created=%s', process.pid, process.create_time())
                              rules = list((root / 'rules').glob('*.md'))
                              assert len(rules) == 1
                              items = [
                                  NativeObject(kind=kind, path=path, directory=is_dir)
                                  for kind, path, is_dir in [
                                      ('temporary-parent', root.parent, True), ('plugin', root, True),
                                      ('mcp-dummy-config', root / OMP_MCP_SERVERS_CONFIG, False),
                                      ('startup-config', root / OMP_MCP_STARTUP_CONFIG, False),
                                      ('startup-js', root / OMP_MCP_STARTUP_JS, False),
                                      ('rules-directory', root / 'rules', True), ('rule', rules[0], False),
                                      ('native-receipt', receipt, False),
                                  ]
                              ]
                              manifest = directory / 'manifest.json'
                              manifest.write_text(json.dumps([item.model_dump(mode='json') for item in items]), encoding='utf-8')
                              await asyncio.to_thread(subprocess.run, [pwsh, '-NoLogo', '-NoProfile', '-NonInteractive', '-File', inspect, '-Exe', exe, '-Manifest', str(manifest), '-Controls', str(directory)], check=True, timeout=45)
                              assert helper.is_running() and native.is_running() and runtime._proc.returncode is None
                              assert all(process.is_running() for process in mcp_processes)
                              await runtime.request(OmpCommandName.GET_AVAILABLE_COMMANDS)
                      finally:
                          try:
                              if helper is not None:
                                  capture_tree(helper, tracked)
                          finally:
                              try:
                                  await runtime.close()
                              finally:
                                  assert_retired(tracked)
                                  assert runtime._proc is None or runtime._proc.returncode is not None, 'Owned helper was not reaped'
              finally:
                  if plugin_parent is not None:
                      assert not plugin_parent.exists(), 'SDK plugin scope was not released'
              logger.info('Real %s startup, native receipt privacy, runner I/O, helper/native/MCP retirement and plugin release proved; no inference', OMP_NATIVE_PINNED_PACKAGE)

          if __name__ == '__main__':
              logging.basicConfig(level=logging.INFO)
              if sys.argv[1:] == ['mcp']:
                  assert McpSettings().BAND_DUMMY_MCP_CREDENTIAL == DUMMY_CREDENTIAL
                  server = FastMCP('local-privacy-control')
                  server.tool()(local_control)
                  server.run(transport='stdio')
              else:
                  asyncio.run(main())
          '@ | Set-Content -LiteralPath $smoke -Encoding utf8
            .venv/Scripts/python.exe $smoke $directory $exe $inspect
            if ($LASTEXITCODE -ne 0) { throw 'Real native privacy smoke failed' }
          } finally {
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
