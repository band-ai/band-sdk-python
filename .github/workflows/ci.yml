# Temporary diagnostic branch only. Retain the registered workflow path so it
# can be dispatched without adding a workflow to the default branch.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-custody-probe:
    name: Windows custody probe (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout diagnostic ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the locked CI environment
        run: uv sync --all-packages --locked --extra dev

      - name: Probe populated Job admission sealing
        run: uv run --all-packages --no-sync python -m tests.integrations.omprpc.winseal

      - name: Preserve pre-teardown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-seal
          path: windows-seal.jsonl
          if-no-files-found: error
          retention-days: 3
