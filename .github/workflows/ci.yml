# Diagnostic branch only; immutable SDK checkout, no native PR publication.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-root-proof:
    name: Windows split root ownership (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: sdk
    env:
      PYTHONPATH: '${{ github.workspace }}/sdk/src;${{ github.workspace }}/sdk'
      E2E_TESTS_ENABLED: 'false'
      DOCKER_TESTS_ENABLED: 'false'
    steps:
      - name: Checkout the immutable corrected SDK root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 42dd5db6b1ec29f6b3a487c720529e5fc66e3a7d
          path: sdk

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install the locked SDK dev environment
        run: uv sync --all-packages --locked --extra dev --python 3.13

      - name: Attribute the executed sources
        run: |
          git rev-parse HEAD
          uv run --all-packages --no-sync python -c "import sys; import band.integrations.omprpc.client as client; import band.integrations.codex.winspawn as spawn; import tests.integrations.omprpc.kit as kit; print('Python:', sys.version); print('SDK client:', client.__file__); print('SDK process owner:', spawn.__file__); print('SDK testkit:', kit.__file__)"

      - name: Exercise injected ownership and both original RPC model cells
        run: >-
          uv run --all-packages --no-sync python -m pytest
          tests/integrations/codex tests/integrations/omprpc
          tests/integrations/test_ompwire.py tests/converters/test_omp.py
          -v --no-cov --hypothesis-show-statistics
