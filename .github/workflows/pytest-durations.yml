# Weekly / on-demand refresh of `.test_durations`. Times the unit suite with
# in-job xdist on one runner and keeps one PR from main: opened or updated
# when the file drifts, closed as stale when it no longer does.
# GitHub only registers workflow_dispatch once this file is on the default
# branch.

name: pytest-durations

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, after weekly CI at 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-durations
  cancel-in-progress: false

env:
  DURATIONS_PATH: .test_durations
  DURATIONS_BRANCH: chore/pytest-durations

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git to use HTTPS for GitHub
        uses: ./.github/actions/git-https-auth

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked --extra dev

      - name: Store unit-test durations
        run: |
          uv run --all-packages pytest \
            -n 4 --dist worksteal \
            --band-store-durations --band-clean-durations \
            --band-durations-path "$DURATIONS_PATH" \
            --ignore=tests/e2e --ignore=tests/integration

      - name: Open, update, or close the durations PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # --head matches fork PRs by branch name too; only our own branch counts.
          open_pr="$(gh pr list --head "$DURATIONS_BRANCH" --base main --state open \
            --json number,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .number')"
          git add -- "$DURATIONS_PATH"
          if git diff --cached --quiet; then
            # main already matches fresh timings, so an open PR is stale.
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --comment "Fresh durations match main; superseded."
            fi
            echo "durations unchanged; no PR"
            exit 0
          fi
          git config user.name "band-release-bot"
          git config user.email "release-bot@band.ai"
          git switch -c "$DURATIONS_BRANCH"
          git commit -m "chore: refresh unit-test durations"
          # Plain --force: the branch is bot-owned with deterministic per-run
          # content, and a re-run must simply overwrite the previous attempt.
          git push -u origin "$DURATIONS_BRANCH" --force
          if [ -z "$open_pr" ]; then
            gh pr create \
              --base main \
              --title "chore: refresh unit-test durations" \
              --body "Scheduled / on-demand rebalance of \`.test_durations\` so in-job xdist starts historically slow tests first. No extra GitHub Actions jobs." \
              --head "$DURATIONS_BRANCH"
          else
            echo "PR for ${DURATIONS_BRANCH} already open; the push updated it."
          fi
