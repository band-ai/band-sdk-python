# Weekly (and on-demand) refresh of committed pytest-split durations.
#
# Shard assignment for the CI `test` job reads `.test_durations`. This
# workflow re-times the unit suite serially and opens a PR when the file
# drifts. A quiet week opens nothing.
#
# Store must run without xdist: pytest-split writes the durations file from
# each process's terminal reporter with no controller/worker guard, so
# workers would clobber it.

name: pytest-durations

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, after weekly CI at 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-durations
  cancel-in-progress: false

env:
  DURATIONS_PATH: .test_durations
  DURATIONS_BRANCH: chore/pytest-durations

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git to use HTTPS for GitHub
        uses: ./.github/actions/git-https-auth

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked --extra dev

      - name: Store unit-test durations
        run: |
          uv run --all-packages pytest -n0 \
            --store-durations --clean-durations \
            --durations-path "$DURATIONS_PATH" \
            --ignore=tests/e2e --ignore=tests/integration

      - name: Open a durations PR when the file drifted
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git add -- "$DURATIONS_PATH"
          if git diff --cached --quiet; then
            echo "durations unchanged; no PR"
            exit 0
          fi
          git config user.name "band-release-bot"
          git config user.email "release-bot@band.ai"
          git switch -c "$DURATIONS_BRANCH"
          git commit -m "chore: refresh pytest-split durations"
          git push -u origin "$DURATIONS_BRANCH" --force
          if [ -z "$(gh pr list --head "$DURATIONS_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --title "chore: refresh pytest-split durations" \
              --body "Weekly rebalance of \`.test_durations\` for pytest-split \`least_duration\` shards." \
              --head "$DURATIONS_BRANCH"
          else
            echo "PR for ${DURATIONS_BRANCH} already open; the push updated it."
          fi
