name: PR776 Windows shell startup hypothesis matrix
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, closed-stdin, noninteractive, both]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/git-https-auth
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install original dependencies
        run: uv sync --all-packages --locked --extra dev
      - name: Collect original baseline
        run: uv run --all-packages pytest tests/e2e/baseline/ --collect-only -q --no-cov
      - name: Prepare independent capture tools without launching PowerShell
        run: |
          mkdir -p artifacts/shell-diagnostic
          dotnet publish .github/scripts/shellwaits/ShellWaits.csproj -c Release -r win-x64 --self-contained false -o artifacts/shell-waits
          python -c "import urllib.request,zipfile,io; data=urllib.request.urlopen('https://download.sysinternals.com/files/Procdump.zip').read(); zipfile.ZipFile(io.BytesIO(data)).extractall('artifacts/shell-diagnostic')"
          python -c "import subprocess,pathlib; r=subprocess.run(['artifacts/shell-diagnostic/procdump64.exe','-accepteula','-?'],capture_output=True); text=r.stdout.decode('utf-16-le'); pathlib.Path('artifacts/shell-diagnostic/procdump-help.txt').write_text(text); assert '-mt' in text and '-at' in text; pathlib.Path('artifacts/shell-diagnostic/procdump-help-exit.txt').write_text(str(r.returncode))"
          python -c "import pathlib; p=pathlib.Path('C:/Program Files (x86)/Windows Kits/10'); pathlib.Path('artifacts/shell-diagnostic/debugger-inventory.txt').write_text('\\n'.join(str(f) for pattern in ('**/cdb.exe','**/wpaexporter.exe','**/xperf.exe') for f in p.glob(pattern)))"
          wpr -profiles > artifacts/shell-diagnostic/wpr-profiles.txt
          wpr -exportprofile CPU artifacts/shell-diagnostic/cpu-profile.wprp
          wpr -start CPU
          wpr -status collectors -details > artifacts/shell-diagnostic/wpr-start.txt
      - name: Restore original inspected workflow before diagnostic measurements
        run: |
          git fetch origin 4a1abcafc6d8ece85e578e9e1df65e0e3795bd61 --depth=1
          git show 4a1abcafc6d8ece85e578e9e1df65e0e3795bd61:.github/workflows/python-core-coverage.yml > .github/workflows/python-core-coverage.yml
          python -c "import subprocess,pathlib; original=subprocess.check_output(['git','show','4a1abcafc6d8ece85e578e9e1df65e0e3795bd61:.github/workflows/python-core-coverage.yml']); assert pathlib.Path('.github/workflows/python-core-coverage.yml').read_bytes()==original"
      - name: Run one cold original pytest shell cell with explicit hypothesis
        run: uv run --all-packages pytest 'tests/framework_conformance/test_approval_commands.py::test_approval_commands_write_and_append_with_host_shell[powershell]' -p tests.framework_conformance.shellmatrix --shell-probe-mode ${{ matrix.mode }} --log-file=artifacts/shell-diagnostic/cell.log --log-file-level=INFO
      - name: Validate resolved native dump stacks without launching PowerShell
        if: always()
        run: python .github/scripts/validate-shell-dump.py
      - name: Preserve bounded recorder after native preflight
        if: always()
        run: |
          wpr -status collectors -details > artifacts/shell-diagnostic/wpr-end.txt || true
          wpr -stop artifacts/shell-diagnostic/suite-end.etl "suite end" || true

      - name: Analyze captured native stacks and process timeline
        if: always()
        run: python .github/scripts/analyze-shell.py
      - name: Upload original diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr776-windows-shell-${{ matrix.mode }}
          path: artifacts/shell-diagnostic
          retention-days: 7
