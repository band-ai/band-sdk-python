[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "band-sdk"
version = "3.0.0"
description = "A Python SDK for Band API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "band.ai" }]
license = { text = "MIT" }
keywords = ["sdk", "band", "api", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "band-client-rest==0.0.27",
    "band-sdk-core==2.2.0",
    "phoenix-channels-python-client>=0.2.4",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "cryptography>=46.0.5",
    "filelock>=3.12",  # Cross-platform advisory file lock for repo init (Docker runners)
    "async-lru>=2.3.0",  # AgentTools._find_attachment's cross-turn cache (band.runtime.tools)
    "ruamel.yaml>=0.18",  # Comment-preserving round-trip write of band.yaml (band-kit provision)
]

[project.optional-dependencies]
logging = [
    # 3.1.0 moved pythonjsonlogger.jsonlogger to pythonjsonlogger.json, which is
    # the module the JSON formatter is configured against.
    "python-json-logger>=3.1.0",
    "rich>=14.0.0",
]
desktop = [
    # Floor pinned to crewai's own transitive pin (mcp~=1.28.1, as of crewai
    # 1.15.16 -- checked 2026-08-18), not the latest 1.x: `pip install
    # band-sdk[crewai,desktop]` together needs both extras' mcp constraints
    # to intersect. Cap is load-bearing (2.0.0 shipped; 2.x drops the
    # lowlevel Server decorator registration this extra's consumers build on).
    "mcp>=1.28.1,<2",
]
codex = [
    "websockets>=13.0",
]
opencode = [
    "httpx>=0.24.0",
    # Capped like every other mcp consumer here: 2.x drops the lowlevel Server
    # decorator registration that LocalMCPServer builds its tool surface with.
    # Floor pinned to crewai's own transitive pin (mcp~=1.28.1, as of crewai
    # 1.15.16 -- checked 2026-08-18), not the latest 1.x -- see `desktop` above.
    "mcp>=1.28.1,<2",
]
letta = [
    "letta-client>=0.1.0",
    # Floor pinned to crewai's own transitive pin (mcp~=1.28.1) -- see `desktop` above.
    "mcp>=1.28.1,<2",
]
pydantic-ai = [
    "pydantic-ai-slim[anthropic]>=2.18.0",
    "openai>=2.0.0",
]
anthropic = [
    "anthropic>=0.75.0",
]
langgraph = [
    "langchain>=1.0.0",
    "langchain-core>=1.2.11",
    "langgraph>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.4.0",  # 0.4.0+ required for langchain 1.0 compatibility
    "langchain-text-splitters>=0.3.0",
    "openai>=2.0.0",
    "beautifulsoup4>=4.12.0",
]
claude_sdk = [
    "claude-agent-sdk>=0.1.81",  # Floor: ResultMessage.errors/api_error_status (used by the failure path). Requires Node.js 20+ and @anthropic-ai/claude-code CLI
]
copilot_sdk = [
    "github-copilot-sdk>=1.0.5",  # Bundles/downloads the Copilot CLI runtime; needs GitHub Copilot auth
]
parlant = [
    # Floor at 3.3.2: older versions stall the in-process server's post-preamble
    # message generation (event-loop starvation).
    "parlant>=3.3.2",
    "openai>=2.0.0",
    "werkzeug>=3.1.6",
]
crewai = [
    "crewai==1.15.5",
    "openai>=2.0.0",  # crewai 1.14.3 requires openai>=2.0.0
    "nest-asyncio>=1.6.0",  # Required for sync-to-async bridging in CrewAI tools
    "pillow>=12.1.1",
]
gemini = [
    "google-genai>=1.43.0",  # httpx is a transitive dep used for retry exception types
]
a2a = [
    "a2a-sdk>=1.1.2,<2",  # Official A2A Python SDK; brings protobuf transitively
]
a2a_gateway = [
    "a2a-sdk[http-server]>=1.1.2,<2",  # Route factories require sse-starlette
    "starlette>=0.40.0",  # HTTP server framework
    "uvicorn>=0.32.0",  # ASGI server
    "python-multipart>=0.0.22",
]
a2a_gateway_demo = [
    "a2a-sdk[http-server]>=1.1.2,<2",  # Demo builds gateway route factories
    "starlette>=0.40.0",    # HTTP server
    "uvicorn>=0.32.0",      # ASGI server
    "langgraph>=1.0.0",     # LangGraph for orchestrator agent
    "langchain-openai>=0.3.0",  # OpenAI model for LLM
    "click>=8.0.0",         # CLI for demo orchestrator
]
acp = [
    # ACP Python SDK. 0.x minors remove protocol methods (0.11.0 removed
    # session/set_model). Left uncapped: tests/integrations/acp/
    # test_server_routing.py dispatches every method through the SDK router,
    # so a bump that removes a method or changes a handler signature fails CI.
    "agent-client-protocol>=0.11.0",
    # Floor pinned to crewai's own transitive pin (mcp~=1.28.1) -- see `desktop` above.
    "mcp>=1.28.1,<2",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
]
slack = [
    "slack-sdk>=3.27.0",     # AsyncWebClient, signature verifier, Socket Mode
    "starlette>=0.40.0",     # HTTP server framework
    "uvicorn>=0.32.0",       # ASGI server
    "aiohttp>=3.9,<4",       # Socket Mode transport (slack_sdk.socket_mode.aiohttp)
]
bridge = [
    "aiohttp>=3.9,<4",      # Health check HTTP server
    "python-dotenv>=1.2.2",    # Environment variable loading
    "httpx>=0.24.0",        # HTTPForwarder transport
]
bridge_agentcore = [
    # Duplicates bridge deps intentionally — pip extras cannot depend on
    # sibling extras, so we list them explicitly here.
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.2.2",
    "httpx>=0.24.0",
    "boto3>=1.35.0",        # AgentCoreForwarder transport
]
agentcore_runtime = [
    # Deps for the container hosted by Bedrock AgentCore Runtime
    # (examples/agentcore/agentcore_llm_server.py). Combine with the
    # adapter extra of your choice (e.g. anthropic).
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
google_adk = [
    "google-adk>=1.0.0,<2",
    "opentelemetry-resourcedetector-gcp>=1.12.0a0,!=1.13.0",
]
agno = [
    "agno>=2.6.0",
]
strands = [
    "strands-agents[openai]>=1.40,<2",
]

# dev extra includes ALL framework deps for testing EXCEPT crewai and parlant.
# crewai is declared conflicting with both parlant and pydantic-ai (pydantic +
# opentelemetry ceilings); parlant is declared conflicting with pydantic-ai
# because their `griffe`/`griffelib` transitive deps are two different PyPI
# distributions that install into the same `griffe` import path — installing
# both corrupts that path (which file wins is install-order dependent). See
# tool.uv.conflicts. To run crewai tests: uv sync --extra dev-crewai. To run
# parlant tests: uv sync --extra dev-parlant.
dev = [
    "pydantic-settings>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=14.0.0",
    "tenacity>=8.0.0",
    "pytest-timeout>=2.4.0",
    "band-testing-python==0.1.4",
    "httpx>=0.24.0",  # Already in main deps, for mocking
    "pytest-httpx>=0.35.0",  # httpx_mock fixture: REST header-emission proof
    # Include pydantic-ai for testing
    "pydantic-ai-slim>=2.18.0",
    # Include anthropic for testing
    "anthropic>=0.75.0",
    # Include claude_sdk for testing
    "claude-agent-sdk>=0.1.81",
    # Include copilot_sdk for testing
    "github-copilot-sdk>=1.0.5",
    # Include langgraph for testing
    "langchain>=1.0.0",
    "langchain-core>=1.2.11",
    "langgraph>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=0.3.0",
    "openai>=2.0.0",
    "beautifulsoup4>=4.12.0",
    # Include a2a-sdk for testing
    "a2a-sdk>=1.1.2,<2",
    # Include a2a_gateway deps for testing
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
    # Include a2a_gateway_demo deps for testing
    "click>=8.0.0",
    # Include ACP deps for testing
    "agent-client-protocol>=0.11.0",
    # Floor pinned to crewai's own transitive pin (mcp~=1.28.1) -- see `desktop` above.
    "mcp>=1.28.1,<2",
    # Include Slack deps for testing
    "slack-sdk>=3.27.0",
    # Include Gemini SDK for testing
    "google-genai>=1.43.0",
    # Include google-adk for testing
    "google-adk>=1.0.0,<2",
    # Google ADK currently requires this pre-release transitively.
    "opentelemetry-resourcedetector-gcp>=1.12.0a0,!=1.13.0",
    # Include Agno for testing
    "agno>=2.6.0",
    # Include Strands Agents for testing
    "strands-agents[openai]>=1.40,<2",
    # Include letta-client for testing
    "letta-client>=0.1.0",
    # Include bridge deps for testing
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.2.2",
    # Include bridge_agentcore deps for testing
    "boto3>=1.35.0",
    # The logging extra's JSON formatter, so its tests run instead of skipping.
    "python-json-logger>=3.1.0",
    # Host-side OpenTelemetry, for the correlation tests and examples/opentelemetry.
    # Band core never depends on these; only the tests and the example do.
    "opentelemetry-sdk>=1.44.0",
    # LoggingInstrumentor's inject_trace_context option, added in 0.64b0.
    "opentelemetry-instrumentation-logging>=0.65b0",
    # Pretty E2E test output
    "rich>=13.0.0",
    # Development tools
    "pre-commit>=3.0.0",
    "ruff>=0.8.0",
    "pyrefly>=0.18.0",
    "commitizen>=3.13.0",
    "pytest-markdown-docs>=0.9.2",
]

# CrewAI-only dev extra for testing crewai adapter in isolation. Declared conflicting
# with dev/parlant/pydantic-ai (pydantic + opentelemetry ceilings), so one uv sync
# resolves either this extra or those, never both.
dev-crewai = [
    "pydantic-settings>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=14.0.0",
    "tenacity>=8.0.0",
    "pytest-timeout>=2.4.0",
    "band-testing-python==0.1.4",
    "httpx>=0.24.0",
    # CrewAI and its deps
    "crewai==1.15.5",
    "openai>=2.0.0",
    "nest-asyncio>=1.6.0",
    "pillow>=12.1.1",
    # Anthropic client: the baseline E2E conftest imports it at module load and
    # the LLM judge needs it. A thin client (pydantic <3), so no crewai conflict.
    "anthropic>=0.75.0",
    # Pretty E2E test output
    "rich>=13.0.0",
    # Development tools
    "ruff>=0.8.0",
    "pyrefly>=0.18.0",
]

# Parlant-only dev extra for testing the parlant adapter in isolation. Declared
# conflicting with pydantic-ai (see the dev extra's comment for why), so one uv
# sync resolves either this extra or dev/pydantic-ai, never both.
dev-parlant = [
    "pydantic-settings>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=14.0.0",
    "tenacity>=8.0.0",
    "pytest-timeout>=2.4.0",
    "band-testing-python==0.1.4",
    "httpx>=0.24.0",
    # Parlant and its deps (see the parlant extra for why >=3.3.2)
    "parlant>=3.3.2",
    "openai>=2.0.0",
    "werkzeug>=3.1.6",
    # Anthropic client: the baseline E2E conftest imports it at module load and
    # the LLM judge needs it. A thin client (pydantic <3), so no parlant conflict.
    "anthropic>=0.75.0",
    # Pretty E2E test output
    "rich>=13.0.0",
    # Development tools
    "ruff>=0.8.0",
    "pyrefly>=0.18.0",
]

[project.scripts]
band-acp = "band.integrations.acp.cli:entry_point"
band-kit = "band.docker.provision:main"
band-room-view = "band.integrations.desktop_app.cli:entry_point"
band-trigger = "band.cli.trigger:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["band", "band.*"]
namespaces = false

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"band" = ["py.typed"]
"band.integrations.slack" = ["templates/*.yaml"]
"band.integrations.desktop_app" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-v"
# Global safety net: catch runaway unit tests. Integration and E2E tests
# override to 120s via pytest_collection_modifyitems in their conftest.
timeout = 30
filterwarnings = [
    # AgentTools._attachment_cache's @alru_cache binds to the first asyncio
    # event loop it runs on; pytest-asyncio's default
    # function-scoped test loop means the *first* test-to-test loop switch
    # trips this once per process, ever -- async_lru's own message says so
    # ("safe but unusual outside of tests"). Real deployments run one loop
    # for the process's whole life and never trigger it.
    "ignore:alru_cache detected event loop change:async_lru.AlruCacheLoopResetWarning",
]
markers = [
    "requires_api: marks tests as requiring real API credentials (skipped in CI)",
    "e2e: marks tests as end-to-end (requires live services)",
    "flaky_reason: baseline flakiness taxonomy stamp (kind + reason); see tests/e2e/baseline/flaky.py",
    "docker_build: builds/runs a real Docker image via subprocess (requires a local Docker daemon; skipped unless DOCKER_TESTS_ENABLED=true, including in CI, which has Docker but shouldn't pay this cost by default)",
    "sandbox: drives a Docker Sandbox via the sbx CLI (needs sbx + a nested-virtualization-capable host + live Band; skipped unless SANDBOX_TESTS_ENABLED=true — CI has neither the CLI nor nested virt)",
    "vscode_chat: drives a real signed-in VS Code window via the code chat CLI (GUI + interactive Copilot sign-in; skipped unless VSCODE_CHAT_TESTS_ENABLED=true — can never run in CI)",
]

[tool.uv.workspace]
# packages/band-mcp: the published `band-mcp` CLI, sharing this repo's engine.
# A plain `uv sync`/`uv run` only installs the root project, not
# workspace members that aren't root dependencies — every dev-loop command
# here and in CLAUDE.md uses `--all-packages`.
members = ["packages/*"]

[tool.uv]
# google-adk pulls opentelemetry-resourcedetector-gcp transitively, whose 1.13.0 is
# yanked and whose only newer release is a pre-release. Steering that resolution is
# ours to do, but the package is not ours to depend on (nothing under src/band
# imports it), so it is a constraint — resolution-only, no direct dependency and no
# pre-release opt-in inherited by `band-sdk[google_adk]` consumers.
constraint-dependencies = [
    "opentelemetry-resourcedetector-gcp>=1.12.0a0,!=1.13.0",
    # parlant pulls fastmcp unconditionally (only a floor: fastmcp>=3.2.0) and
    # griffe directly. fastmcp 3.2.4 (2026-04-14) added its own dependency on
    # griffelib — a *different* PyPI distribution that installs files into the
    # same `griffe` import path griffe itself uses, so parlant's own dependency
    # tree pulls both distributions into one `griffe/` directory regardless of
    # any other extra (e.g. pydantic-ai). fastmcp 3.2.0-3.2.3 have no griffe/
    # griffelib dependency at all, so capping below 3.2.4 keeps parlant on a
    # single, uncorrupted `griffe`. Resolution-only: nothing under src/band
    # depends on fastmcp directly.
    "fastmcp>=3.2.0,<3.2.4",
]

# Ensure uv.lock stays installable on the platforms we use locally and in CI
# when a dependency only publishes wheels and no source distribution.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# crewai is resolved apart from BOTH parlant and pydantic-ai. crewai pins a narrow
# pydantic range (<2.13) and an exact opentelemetry-sdk minor (~=1.42.0), while
# pydantic-ai-slim 2.x requires pydantic>=2.12 and parlant requires
# opentelemetry-sdk>=1.37. Declaring the extras as conflicting lets uv resolve each
# side in its own fork instead of forcing one shared pin that satisfies everyone.
#
# parlant is separately resolved apart from pydantic-ai for an unrelated reason:
# parlant depends on the `griffe` distribution and pydantic-ai-slim depends on
# `griffelib` — two different PyPI distributions that both install files into the
# same `griffe` import path. Installing both corrupts that path (whichever wheel's
# files land last wins per file, nondeterministic by install order), so they must
# never share a resolved environment either.
conflicts = [
    [
        { extra = "crewai" },
        { extra = "parlant" },
    ],
    [
        { extra = "crewai" },
        { extra = "pydantic-ai" },
    ],
    [
        { extra = "parlant" },
        { extra = "pydantic-ai" },
    ],
    [
        { extra = "dev" },
        { extra = "crewai" },
    ],
    [
        { extra = "dev" },
        { extra = "parlant" },
    ],
    [
        { extra = "dev" },
        { extra = "dev-crewai" },
    ],
    [
        { extra = "dev" },
        { extra = "dev-parlant" },
    ],
    [
        { extra = "dev-crewai" },
        { extra = "parlant" },
    ],
    [
        { extra = "dev-crewai" },
        { extra = "pydantic-ai" },
    ],
    [
        { extra = "dev-crewai" },
        { extra = "dev-parlant" },
    ],
    [
        { extra = "dev-parlant" },
        { extra = "pydantic-ai" },
    ],
    [
        { extra = "dev-parlant" },
        { extra = "crewai" },
    ],
]

[tool.pyrefly]
project_includes = [
    "src/**/*.py",              # Only check source files
    # Skill scripts are checked-in tooling with real process/subprocess logic and
    # no other type gate. Narrow glob on purpose: a bare `.claude/**` would drag
    # in `.claude/worktrees/` checkouts, which the excludes heuristic below no
    # longer filters out.
    ".claude/skills/**/*.py",
    "packages/band-mcp/src/**/*.py",
]
project_excludes = [
    "tests/**",                 # Tests use mocks with duck typing
    "examples/**",              # Examples use local imports
    "band-bridge/**",        # Standalone bridge app, not in src/ import root
]
# CrewAI is in a conflict group with parlant/pydantic-ai and not installed in
# the default venv. Rather than excluding the files (which loses type coverage
# in a dev-crewai venv), tell pyrefly to treat missing crewai modules as Any.
ignore-missing-imports = [
    "crewai.*",
    "nest_asyncio",
]
# Disable the default **/.[!/.]*/** exclude so pyrefly works inside
# .claude/worktrees/ (git worktree paths contain a hidden directory).
disable-project-excludes-heuristics = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.2"
version_files = [
    "pyproject.toml:version",
    "src/band/__init__.py:__version__",
]
# Tag format aligned with release-please (package-name-v$version)
tag_format = "band-sdk-python-v$version"
