[project]
name = "band-kit-example"
version = "0.1.0"
description = "Example customer workspace for the Band Python Sandbox kit."
requires-python = ">=3.11"
# Proxy-managed custody requires WebSocket credentials in the x-api-key
# handshake header; the sandbox proxy never rewrites credentials in the URL.
dependencies = ["band-sdk>=6.0.1", "pydantic-settings>=2.15.0"]
