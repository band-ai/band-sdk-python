# syntax=docker/sandbox-kit:3@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: "3"
kind: workload
displayName: Band Python Agent
description: Run a locked Python agent workspace on Band inside a Docker Sandbox.
sourceUrl: https://github.com/band-ai/band-sdk-python
licenses: [MIT]
dockerfile: Dockerfile

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - app.band.ai
          - pypi.org
          - files.pythonhosted.org
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        This workspace contains a Python agent launched by the Band Sandbox kit.
        Agent configuration is in band.yaml.
        Dependency changes must update both pyproject.toml and uv.lock.
        Add network access only for services this agent actually uses.
        Never print or commit configured credentials.

# Credentials are scoped host-side before creation; see README.md.
# Keep provider and deployment-specific hosts out of the baseline policy.
