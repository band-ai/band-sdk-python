# schemaVersion "2" is Docker Sandboxes' current kit-spec contract (the
# fields below), enforced by `sbx` v0.42.1+; the OCI v2 kit artifact format
# (tar+gzip layer, spec in the manifest config blob) is the same packaging
# `sbx kit push` has used since v0.35.0.
schemaVersion: "2"
kind: sandbox
name: band-python-kit
displayName: Band Python Agent
description: Run a workspace Python agent on Band inside a Docker Sandbox.

sandbox:
  image: band-python-kit:local
  # A self-contained argv, not just the launcher: `sbx run` execs this
  # directly, bypassing the image's own Dockerfile ENTRYPOINT, so the chain
  # must still open with band-entrypoint.sh (proxy-CA install as root, then a
  # setpriv drop to uid 1000) before it reaches the launcher.
  #
  # This only runs once something attaches (`sbx run --name <name>`) — `sbx
  # create` alone leaves the sandbox idle. `sbx` v0.43.0 auto-stops an idle,
  # unattached sandbox within ~60-90s regardless of what's running inside it —
  # a backgrounded launcher does not count as activity — so keeping this
  # agent up requires a host-side process holding that attach open with a
  # real pty (e.g. a systemd/launchd unit or tmux session running `sbx run`)
  # — see the kit README's "How the launch works" section.
  entrypoint:
    - /usr/local/bin/band-entrypoint.sh
    - /opt/band/venv/bin/python
    - -m
    - band.docker.launcher

agentInstructions:
  filename: AGENTS.md
  content: |
    This workspace contains a Python agent launched by the Band Sandbox kit.
    Agent configuration is in band.yaml.
    Dependency changes must update both pyproject.toml and uv.lock.
    Anthropic API access is included. Add network access only for other
    providers, repository hosts, or services this agent actually uses.
    Never print or commit configured credentials.

# Locked dependency sync still downloads package artifacts, so a fresh
# sandbox needs both PyPI hosts as well as Band and the model provider.
permissions:
  network:
    allow:
      - app.band.ai
      - pypi.org
      - files.pythonhosted.org
      - api.anthropic.com

# Echo agents and agents using another provider do not need an Anthropic key.
# The host owns the key; the agent receives only the proxy-managed sentinel.
credentials:
  - service: anthropic
    description: Anthropic API key for agents using Claude
    required: false
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"

# Band's API key remains host-configured via `sbx secret set-custom`, so its
# injection target follows the operator's production or self-hosted deployment.
